<style>

/* 2026-10-16 (Angela, explicit, option 4 of 4): swapped the pink BB coin mark for the full Level Up wordmark

.sidepair{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;margin-top:4px}
.sidepair-note{font-size:13px;line-height:1.55;color:#6c7488;margin:22px 0 0}

.sidecol-pub{font-size:11.5px;color:#6c7488}
.sidecol-badge{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--pink);
  border:1px solid var(--pink-line);border-radius:999px;padding:2px 8px}
/* The column's own status. Tone classes mirror levelup-words.js `tone` one-to-one - no condition picks

.sidecol-state.tone-complete .sidecol-state-h{color:var(--pink)}
.sidecol-state.tone-stopped{border-left-color:var(--red);background:rgba(239,68,68,.06)}
.sidecol-state.tone-stopped .sidecol-state-h{color:var(--red-d)}
.sidecol-state.tone-watch{border-left-color:var(--pink);background:#FFF4FA}
.sidecol-state.tone-watch .sidecol-state-h{color:#A4006A}
.sidecol-state.tone-expired,.sidecol-state.tone-closed{border-left-color:#9aa1b2;background:#F1F2F6}
.sidecol-state.tone-expired .sidecol-state-h,.sidecol-state.tone-closed .sidecol-state-h{color:#4C5663}
.page-levels-note{margin-top:18px}
.dirtag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em}
.dirtag.d-long{background:#e7f4ee;color:#0f7a52}
.dirtag.d-short{background:#fcebe9;color:#a8231f}
/* .sidenote was the dropdown's explanatory line; the rule is kept only because the contrast pass at the

/* 2026-10-21 (Angela, explicit): "disclaimer disclaimer disclaimer... it needs to say I am not a financial

.dyor{margin:14px 0 0;border:2px solid var(--pink);border-radius:12px;background:#FDE7F5;padding:13px 16px}

.rl{font-family:Archivo;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}.rl .now-ts{text-transform:none;font-weight:600;letter-spacing:0;color:var(--gray);font-size:11px;margin-left:2px}.rn{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.45}

.diff{font-size:12px;color:var(--orange-d);background:#FFF4E0;border:1px solid var(--orange);border-radius:8px;padding:8px 12px;margin:10px 0}
.hist{border:2px solid var(--pink-line);border-radius:12px;padding:16px 18px;margin-bottom:10px;background:#fff}

.hist .hv{font-family:Archivo;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.hist .hd{font-family:"JetBrains Mono";font-size:11px;color:var(--gray)}

.src{display:inline-block;font-family:Inter;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid;margin-right:6px;vertical-align:middle;white-space:nowrap}
.s-ch{color:var(--pink);border-color:var(--pink);background:var(--pink-soft)}.s-ad{color:#374151;border-color:var(--gray2);background:#F3F4F6}.s-pc{color:#1D4ED8;border-color:#93C5FD;background:#EFF6FF}.s-ot{color:#92400E;border-color:#FCD34D;background:#FFFBEB}
.tl{margin:14px 0 4px;border:2px solid var(--pink-line);border-radius:12px;padding:12px 16px;display:grid;gap:8px;font-size:13px;line-height:1.5}

.histnote{background:#F3F4F6;border:2px dashed var(--gray2);border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.55;margin:0 0 12px;color:#374151}
.hist.pcrow{opacity:.78;border-style:dashed}
.foot{margin-top:32px;padding-top:18px;border-top:2px solid var(--pink-line);text-align:center}.foot .f1{font-family:Archivo;font-weight:800;font-size:13px;letter-spacing:.18em;color:var(--pink);text-transform:uppercase}.foot .f2{font-size:11.5px;color:var(--gray);margin-top:8px;line-height:1.6;max-width:720px;margin-left:auto;margin-right:auto}

/* PHONE WIDTH: THE PAIR STACKS, BOTH SIDES STILL FULLY OPEN (Ang, 2026-11-06). One column, and the order
   is the SOURCE order, which is the lead order - no `order` property and nothing re-deciding which side
   comes first, so the phone can never disagree with the desktop about that. Collapsing either side here

<style id="att-css">
/* ===== LIVE ATTENTION (staging addon) — presentation only; tiers map 1:1 to the monitor's attention bands ===== */
.att{margin-top:30px}
.att[hidden]{display:none}
.att-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.att-title{font-family:Archivo,Inter,system-ui,sans-serif;font-weight:900;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.att-title em{font-style:normal;color:var(--pink)}
.att-live{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--gray);letter-spacing:.03em}
.att-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle;animation:attBlink 1.6s ease-in-out infinite}
.att-dot.off{background:var(--gray2);animation:none}
.att-note{font-size:11.5px;color:var(--gray);line-height:1.55;margin-top:8px;max-width:820px}
.att-note b{color:#374151}

/* ticker tape */
.att-tape{margin-top:14px;overflow:hidden;border:2px solid var(--pink-line);border-radius:999px;background:#fff;position:relative}
.att-tape-track{display:flex;width:max-content;gap:0;animation:attTape 42s linear infinite}
.att-tape:hover .att-tape-track{animation-play-state:paused}
.att-tape-item{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;font-family:"JetBrains Mono",monospace;font-size:12px;white-space:nowrap;color:#374151;text-decoration:none;border-right:1px solid var(--pink-line)}
.att-tape-item b{font-family:Archivo,Inter,sans-serif;font-weight:900;font-size:13px;color:var(--ink);letter-spacing:.02em}
.att-tape-item .p{font-weight:800;color:var(--tc,#374151)}
.att-tape-item.tier-3 .p,.att-tape-item.tier-4 .p{color:var(--pink)}

/* cards */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px;margin-top:14px}
a.att-card{--tc:#9CA3AF;--tg:rgba(156,163,175,.35);position:relative;display:block;text-decoration:none;color:inherit;border:2px solid var(--tc);border-radius:14px;padding:14px 16px 13px;background:#fff;transition:transform .2s,box-shadow .2s}
a.att-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px var(--tg)}
.att-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.att-asset{font-family:Archivo,Inter,sans-serif;font-weight:900;font-size:24px;letter-spacing:-.01em}
.att-dir{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#374151}
.att-pct{display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.att-pct b{font-family:Archivo,Inter,sans-serif;font-weight:900;font-size:30px;line-height:1;color:var(--tc);letter-spacing:-.02em}
.att-pct span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tc)}
.att-tag{display:inline-block;margin-top:8px;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:2px solid var(--tc);color:var(--tc);background:#fff}
.att-bar{height:6px;border-radius:99px;background:#F3F4F6;margin-top:10px;overflow:hidden}
.att-bar i{display:block;height:100%;border-radius:99px;background:var(--tc);transition:width .6s}
.att-meta{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--gray);margin-top:8px;line-height:1.55}

/* tiers = engine bands: 0 NORMAL >3% · 1 ATTENTION ≤3% · 2 MORE NOTICEABLE ≤2% · 3 HIGH ≤1% · 4 MAXIMUM ≤0.5% or inside the zone */
a.att-card.tier-0{--tc:#6B7280;--tg:rgba(107,114,128,.25);border-color:var(--pink-line)}
a.att-card.tier-0 .att-pct b{font-size:28px}
a.att-card.tier-1{--tc:#D9A404;--tg:rgba(217,164,4,.30);background:#FFFBEA}
a.att-card.tier-1 .att-pct b{font-size:32px}
a.att-card.tier-2{--tc:#E67E00;--tg:rgba(230,126,0,.32);background:#FFF4E0;border-width:3px}
a.att-card.tier-2 .att-pct b{font-size:38px}
a.att-card.tier-3{--tc:#FA0398;--tg:rgba(250,3,152,.32);background:#FFF0F8;border-width:3px;animation:attPulse 2.2s ease-in-out infinite}
a.att-card.tier-3 .att-pct b{font-size:44px}
a.att-card.tier-4{--tc:#FA0398;--tg:rgba(250,3,152,.45);background:#FFE1F1;border-width:4px;animation:attPulseFast 1.15s ease-in-out infinite}
a.att-card.tier-4 .att-pct b{font-size:50px}
a.att-card.tier-4 .att-tag{background:var(--tc);color:#fff}
a.att-card.tier-3 .att-tag{background:var(--tc);color:#fff}
.att-sub{margin-top:18px;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}
.att-past{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
a.att-past-chip{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border:2px dashed var(--gray2);border-radius:999px;font-family:"JetBrains Mono",monospace;font-size:11px;color:#4B5563;text-decoration:none;background:#fff}
a.att-past-chip b{font-family:Archivo,Inter,sans-serif;font-weight:900;color:var(--ink)}
.att-empty{padding:16px;border:2px dashed var(--pink-line);border-radius:12px;color:var(--gray);font-size:13px;margin-top:14px}

/* ACTIVE NOW — status-driven section, deliberately different from the proximity cards (solid side bar, no proximity tiers, no pulse) */
.att.act{margin-top:26px}
.act-em{font-style:normal;color:var(--green-d)}
.act-grid{grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
a.act-card{--ac:#22C55E;--ad:#15803D;position:relative;display:block;text-decoration:none;color:inherit;border:2px solid var(--ac);border-left-width:10px;border-radius:14px;padding:14px 16px 13px;background:#F0FDF4;transition:transform .2s,box-shadow .2s}
a.act-card.side-short{--ac:#EF4444;--ad:#B91C1C;background:#FEF2F2}
a.act-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(21,128,61,.18)}
a.act-card.side-short:hover{box-shadow:0 10px 26px rgba(185,28,28,.18)}
.act-status{font-family:Archivo,Inter,sans-serif;font-weight:900;font-size:26px;letter-spacing:.01em;color:var(--ad);margin-top:6px;line-height:1.05}
.act-tag{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:2px solid var(--ac);color:var(--ad);background:#fff}
.att-chip.act{--tc:#15803D;background:#F0FDF4;border-color:#22C55E}
.att-chip.act.act-short{--tc:#B91C1C;background:#FEF2F2;border-color:#EF4444}
.att-chip.act span{font-size:12px}

/* chips reused on the existing grid cards and on the per-asset page */
.att-chip{--tc:#6B7280;--tg:rgba(107,114,128,.25);display:inline-flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin:8px 0 2px;padding:6px 12px;border:2px solid var(--tc);border-radius:10px;background:#fff;font-family:Archivo,Inter,sans-serif;font-weight:900;color:var(--tc);line-height:1.1}
.att-chip b{font-size:22px;letter-spacing:-.01em}
.att-chip span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.att-chip small{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:10.5px;color:var(--gray);letter-spacing:0}
.att-chip.tier-1{--tc:#D9A404;background:#FFFBEA}.att-chip.tier-2{--tc:#E67E00;background:#FFF4E0}
.att-chip.tier-3{--tc:#FA0398;background:#FFF0F8;animation:attPulse 2.2s ease-in-out infinite}
.att-chip.tier-4{--tc:#FA0398;background:#FFE1F1;animation:attPulseFast 1.15s ease-in-out infinite}
.att-chip.tier-4 b,.att-chip.tier-3 b{font-size:26px}
.att-chip.passed{--tc:#6B7280;border-style:dashed}

@keyframes attPulse{0%,100%{box-shadow:0 0 0 0 var(--tg)}50%{box-shadow:0 0 0 8px rgba(250,3,152,0)}}
@keyframes attPulseFast{0%,100%{box-shadow:0 0 0 0 var(--tg)}50%{box-shadow:0 0 0 12px rgba(250,3,152,0)}}
@keyframes attBlink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes attTape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){
  a.att-card,a.act-card,.att-chip,.att-dot,.att-tape-track{animation:none!important;transition:none!important}
  .att-tape{overflow-x:auto}
  a.att-card.tier-3,a.att-card.tier-4,.att-chip.tier-3,.att-chip.tier-4{box-shadow:0 0 0 4px var(--tg)}
}
@media(max-width:640px){.att-title{font-size:20px}.act-grid{grid-template-columns:repeat(2,minmax(0,1fr))}a.act-card{min-width:0;padding:11px 11px 10px}.act-status{font-size:20px}.att-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}a.att-card{min-width:0;padding:11px 11px 10px}.att-top{flex-wrap:wrap}.att-meta{overflow-wrap:anywhere}.att-asset{font-size:21px}.att-pct b{font-size:26px!important}a.att-card.tier-4 .att-pct b{font-size:36px!important}a.att-card.tier-3 .att-pct b{font-size:32px!important}a.att-card.tier-2 .att-pct b{font-size:30px!important}}
#att-chip{margin:12px 0 18px}
</style>
</head>
<body><!-- PREVIEW-BANNER-START (generated by scripts/publish-staging.js - do not edit) -->
<div id="preview-banner" role="status">PREVIEW — NOT THE LIVE BOARD</div>
<!-- PREVIEW-BANNER-END -->

<div class="sheet"><div class="glow g1"></div><div class="glow g2"></div>
<div class="inner" id="app"><div class="empty">Loading the latest read…</div></div>
</div>

<script>
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/1MqfOX5EzRYvjQbd6U9RZTZ2ujm9_xx0LoT5rAzZxcPI/gviz/tq?tqx=out:csv&gid=1165837241";
const LOGO_SRC  = "levelup_logo.png";

const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search); const ASSET=(q.get("asset")||"AAVE").toUpperCase();
/* 2026-10-28: the board now renders one card per SIDE, and each card links to its own side. When the link
   names one, it OVERRIDES the "live side leads" ordering below - the member clicked a specific trade and
   must land on that trade, not on whichever side the board would otherwise have led with. An absent or
   unrecognised side leaves the ordering exactly as it was, which is what every single-sided asset uses. */
const WANT_SIDE=(function(){const v=(q.get("side")||"").toLowerCase();return v==="long"||v==="short"?v:null;})();

function parseCSV(t){const rows=[];let row=[],cur="",inq=false;for(let i=0;i<t.length;i++){const c=t[i];if(inq){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=c;}else{if(c==='"')inq=true;else if(c===","){row.push(cur);cur="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur="";}else cur+=c;}}if(cur.length||row.length){row.push(cur);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()));}
function objs(rows){const h=rows[0].map(x=>x.trim().toLowerCase());return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||"").trim());return o;});}
const _get=(o,...keys)=>{for(const k of keys){const hit=Object.keys(o).find(h=>h.includes(k));if(hit&&o[hit])return o[hit];}return "";};
const get=(o,...keys)=>{
  const k=keys[0];
  if(/^tp[123]$/.test(k)){const n=+k[2];const single=_get(o,k);const combo=Object.keys(o).find(h=>h.includes("tp1")&&h.includes("tp2"));
    if(combo&&o[combo]){const txt=o[combo];const lab={};for(const m of txt.matchAll(/TP\s*([123])\s*:\s*\$?\s*(\d[\d,]*(?:\.\d+)?)/gi))lab[m[1]]=m[2].replace(/,/g,"");if(Object.keys(lab).length)return lab[n]||"";if(txt.includes("/")){const seg=txt.split("/").map(x=>(x.match(/\d+(\.\d+)?/)||[])[0]);return seg[n-1]||"";}const nums=txt.match(/\d+(\.\d+)?/g)||[];return nums[n-1]||"";} return single;}
  if(k==="stop")return _get(o,"stop","stp");
  if(k==="trigger 3")return _get(o,"trigger 3","tigger 3");
  if(k==="confidence up"||k==="confidence down"){const combo=Object.keys(o).find(h=>h.includes("confidence up")&&h.includes("down"));
    if(combo&&o[combo]){const parts=o[combo].split(/\n|\s\/\s|\|/).map(x=>x.trim()).filter(Boolean);return k==="confidence up"?(parts[0]||""):(parts[1]||"");} return _get(o,k);}
  return _get(o,...keys);};
/* 2026-09-30 fix (Angela-reported: "all trade setups showing a trigger of $1"): the old num() took the FIRST
   bare digit anywhere in the text, with no exclusion for a timeframe/ratio suffix - so a Trigger field whose
   real number has no leading "$" (e.g. BNB/ETH/XRP 2026-09-30: "Completed 1H hold above... Entry Zone: 754-761")
   matched the "1" in "1H" instead of the real level. This never affected the mechanical monitor (core/levelup-
   core.js's own scanNumbers already excludes these correctly) - it was this page's own separate, simpler Ladder-
   display parser only. Mirrors the exclusion scanNumbers()/TF below already use, kept self-contained here since
   this function runs before that later script block exists. */
const NUM_TF_SUFFIX=/^\s*(?:h|hr|hrs|hour|hours|m|min|d|w|r)\b/i;
const num=s=>{const clean=String(s).replace(/,/g,"");const re=/\d+(?:\.\d+)?/g;let m;while((m=re.exec(clean))){if(!NUM_TF_SUFFIX.test(clean.slice(m.index+m[0].length)))return parseFloat(m[0]);}return null;};
const numTrigger=s=>{const clean=String(s).replace(/,/g,"");const dollar=clean.match(/\$\s*(\d+(\.\d+)?)/);if(dollar)return parseFloat(dollar[1]);return num(clean);};
/* Low-price precision fix (2026-09-23): below $0.01, a fixed decimal count collapsed distinct published
   levels into the same string (e.g. SHIB's 0.0000057 and 0.00000575 both showed as "$0.000006"). This
   shows the exact zero-count + significant digits instead (standard exchange convention, e.g.
   $0.0₄675 = 0.0000675), never rounding away a digit that makes one level distinguishable from another.
   Presentation only - the raw number (data-p on each row, and every calculation) is untouched. Values
   >= $0.01 are formatted exactly as before. Does not touch fmtPrice() (the separate LIVE ATTENTION
   formatter) - that is a known, separate follow-up, not part of this fix. */
const SUBSCRIPTS="₀₁₂₃₄₅₆₇₈₉";
const toSubscript=n=>String(n).split("").map(d=>SUBSCRIPTS[+d]).join("");
function splitLowPrice(p){const s=p.toFixed(18).replace(/0+$/,"").replace(/\.$/,"");const m=s.match(/^0\.(0*)([1-9]\d*)$/);return m?{zeros:m[1].length,sig:m[2]}:null;}
const fmt=p=>{if(p==null)return"—";if(p>=0.01)return"$"+p.toFixed(p>=100?2:p>=1?3:4);const sp=splitLowPrice(p);if(!sp)return"$"+p.toFixed(6);return sp.zeros<=3?"$0."+"0".repeat(sp.zeros)+sp.sig:"$0.0"+toSubscript(sp.zeros-1)+sp.sig;};
const cleanHeadline=(a,h)=>{const esc_a=String(a).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");const re=new RegExp("^\\s*"+esc_a+"\\s*[—–\\-:]*\\s*","i");return String(h||"").replace(re,"").trim();};
/* 2026-10-03 (Angela, explicit): see index.html's copy of this comment for the full rationale - Chelsea's pattern
   jargon ("Above The Pile", admin-update boilerplate) isn't shown at the top of the detail page either now. */
const watchLabel=h=>{const m=/\b(Long|Short)\s+Watch\b/i.exec(h||"");return m?m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+" Watch":null;};
// 2026-10-04 (Angela, explicit, confirmed directly with Chelsea): "the pile" is not Chelsea's own term - it's
// her LLM's paraphrase of "the Simple and Smooth moving averages bundling together, with RSI/Stochs pointed
// up" (a real, specific technical condition, already stated in nearly every Why block right after the word
// "pile"). "MA bundle" is the fix because it's not invented - it's the exact term already used correctly
// elsewhere on this same board (ETH "Hold Above Short MA Bundle", BNB "Fast MA Bundle Hold"), so this makes
// "pile" setups consistent with the rest of the board instead of introducing a second, unexplained term.
// Display-only, word-boundary matched, applied to the Why block even though that block is otherwise verbatim
// (see the 2026-10-04 "Why paragraph" decision) - this isn't stripping Chelsea's reasoning, it's correcting a
// mistranslation layer that sat on top of it; the Sheet's real stored text is never altered.
const clarifyPileLanguage=w=>String(w||"").replace(/\bpile\b/gi,m=>m[0]===m[0].toUpperCase()?"MA Bundle":"MA bundle");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHART_LINK_HOSTS=["tradingview.com","drive.google.com"];
const isAllowedChartHost=h=>CHART_LINK_HOSTS.some(d=>h===d||h.endsWith("."+d));
const safeUrl=u=>{try{const p=new URL(String(u));if(!/^https?:$/.test(p.protocol))return null;return isAllowedChartHost(p.hostname)?u:null;}catch(e){return null;}};
const stamp=s=>{const d=new Date(s);return isNaN(d)?s:d.toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})+" EST";};
const driveId=u=>{const m=String(u).match(/[?&]id=([\w-]+)/)||String(u).match(/\/d\/([\w-]+)/);return m?m[1]:null;};
function chartImg(img,link){const id=driveId(img);if(id)return `https://drive.google.com/thumbnail?id=${id}&sz=w1600`;const tv=String(link).match(/tradingview\.com\/x\/(\w+)/);if(tv)return `https://s3.tradingview.com/snapshots/${tv[1][0]}/${tv[1]}.png`;return null;}
const STATUS=s=>{s=s.toLowerCase();if(s.includes("short"))return["b-short","▼ ACTIVE SHORT"];if(s.includes("active")||s.includes("long"))return["b-active","▲ ACTIVE LONG"];if(s.includes("watch"))return["b-watch","👀 WATCHING — NO TRIGGER YET"];if(s.includes("no trade"))return["b-none","NO TRADE RIGHT NOW"];if(s.includes("invalid"))return["b-invalid","✕ INVALIDATED — SETUP NO LONGER VALID"];if(s.includes("closed"))return["b-closed","■ CLOSED — SEE THE LESSON"];return["b-none",s.toUpperCase()];};

function levels(r){
  const L=[];const add=(role,val,kind,note,parse=num)=>{const p=parse(val);if(p!=null)L.push({role,price:p,kind,note});};
  add("TP3",get(r,"tp3"),"tp","Final target. Runner only.");add("TP2",get(r,"tp2"),"tp","Second scale-out. Move stop to entry or better.");add("TP1",get(r,"tp1"),"tp","First scale-out. Take 70–75% into targets.");
  [3,2,1].forEach(i=>{const t=get(r,"trigger "+i);if(t){const p=numTrigger(t);L.push({role:"TRIGGER "+i,price:p,kind:"res",note:t});}});
  add("SUPPORT / SAFETY NET",get(r,"safety"),"sup","Structure the trade leans on. Stop goes below, not inside.",numTrigger);add("STOP",get(r,"stop"),"stop","Size the position to this. Never tighten the stop to fit the size.");
  return L.filter(l=>l.price!=null).sort((a,b)=>b.price-a.price);
}
/* ===== STAGED (sheet-next): source types, authoritative status, setup-source carry-forward ===== */
const LEVEL_KEYS=["trigger 1","trigger 2","trigger 3","tp1","tp2","tp3","stop","safety"];
const hasLevels=r=>LEVEL_KEYS.some(k=>get(r,k));
const rowTs=r=>new Date(get(r,"timestamp"));
const isPC=r=>{const s=get(r,"source type");return s?/price/i.test(s):/^\s*price[- ]?check/i.test(get(r,"headline"));};
const srcType=r=>{const s=(get(r,"source type")||"").toLowerCase();
  if(s.includes("chelsea"))return"CHELSEA SETUP";if(s.includes("admin"))return"ADMIN STATUS";if(s.includes("price"))return"PRICE CHECK";if(s)return"OTHER / UNKNOWN";
  if(isPC(r))return"PRICE CHECK";if(!get(r,"status"))return"OTHER / UNKNOWN";
  if(/reactivat|^\s*no update since|^\s*triggered\b|not a new call from chelsea/i.test(get(r,"headline")+" "+get(r,"warning")))return"ADMIN STATUS";
  return(hasLevels(r)||get(r,"why"))?"CHELSEA SETUP":"ADMIN STATUS";};
const SRC_CLS={"CHELSEA SETUP":"s-ch","ADMIN STATUS":"s-ad","PRICE CHECK":"s-pc","OTHER / UNKNOWN":"s-ot"};
const srcBadge=t=>`<span class="src ${SRC_CLS[t]}">${t}</span>`;
const tpTxt=r=>[1,2,3].map(k=>get(r,"tp"+k)||"—").join(" / ");
const tpRaw=r=>{const k=Object.keys(r).find(h=>h.includes("tp1")&&h.includes("tp2"));return(k&&r[k])||"";};
function diffLevels(a,b){if(!b)return[];const out=[];
  [["TARGETS",tpRaw],["STOP",r=>get(r,"stop")],["SAFETY",r=>get(r,"safety")],["TRIGGER 1",r=>get(r,"trigger 1")],["TRIGGER 2",r=>get(r,"trigger 2")],["TRIGGER 3",r=>get(r,"trigger 3")]]
   .forEach(([k,f])=>{if(f(a)!==f(b))out.push(k.toLowerCase());});return out;}

let MECH=null;   /* monitor-feed.json, read once before render purely to order a two-sided setup - see pairedSides() */
async function load(){
  let text="";
  if(SHEET_CSV){try{const r=await fetch(SHEET_CSV+(SHEET_CSV.includes("?")?"&":"?")+"t="+Date.now());text=await r.text();}catch(e){}}
  /* Best-effort and time-boxed. A missing, slow or malformed feed leaves MECH null and the page orders a pair
     exactly as it did before. The detail page must never fail to render because a supplementary file was late;
     the mech-feed addon below does its own independent fetch for everything else it shows. */
  try{
    MECH=await Promise.race([
      fetch('monitor-feed.json?t='+Date.now()).then(r=>r.ok?r.json():null),
      new Promise(res=>setTimeout(()=>res(null),2500))
    ]);
  }catch(e){MECH=null;}
  if(!text){$("#app").innerHTML=`<div class="empty">Can't read the setup sheet. Share it as <b>Anyone with the link → Viewer</b>.</div>`;return;}
  const rows=objs(parseCSV(text)).filter(r=>get(r,"asset").toUpperCase()===ASSET);
  if(!rows.length){$("#app").innerHTML=`<div class="empty">No setup on file for <b>${esc(ASSET)}</b> yet.</div>`;return;}
  rows.sort((a,b)=>rowTs(a)-rowTs(b));
  const auth=rows.filter(r=>!isPC(r)&&get(r,"status"));
  /* AND THE STATUS ROW TOO (2026-10-23). A pair has two status rows, one per side. Taking the later one by the
     clock gave BTC the retired long, two seconds newer than the short that actually triggered. Searches `rows`
     rather than `setupRows`, because setupRows is derived from cur and so cannot be used to choose it. */
  const mechSide=(d)=>{try{return (MECH&&MECH.assets&&MECH.assets[ASSET+"|"+String(d).toUpperCase()])||null;}catch(e){return null;}};
  /* WHICH SIDE OF A PAIR LEADS THIS PAGE - ONE IMPLEMENTATION, IN THE SHARED CORE (2026-11-06).
     Deleted from here: SIDE_OVER_STATES, sideOver, sideRank, currentBatchDirs and pickSide - this page's own
     copy of the ranking, the two-hour batch window and the tie-breaks. sideTrigMs is NOT deleted; it is
     still declared below, because it reads a FACT off the feed (when a side triggered) and decides nothing.
     It is handed to the shared ordering as an input. index.html's
     mech-feed and this page's own mech-feed each carried the same thing again, with the same explanatory
     comment pasted at all three sites. That is CURRENT_STATE.md known problem 2, and it caused the BTC,
     LINK, HYPE and ADA side bugs - eight rounds in thirteen days. All three call
     LevelUpCore.pickPairSide now; the rule, and why liveness comes before recency, is documented once in
     core/levelup-core.js.

     THE SHEET STILL SUPPLIES THE CLOCK HERE (2026-10-30, HYPE). `pubOf` is the caller's SHEET publication
     time for a side, falling back to the feed's. That morning the feed was five hours behind and held
     HYPE's 10/26 long and 10/29 short, so "the newest batch" resolved to the 10/29 short and today's 5:08
     AM long - the setup a member had come to read - was dropped before anything ranked it. The Sheet is the
     authority on when Chelsea published; the feed is the authority on what has happened since. */
  const sidePubMs=(d)=>{const e=mechSide(d);const t=(e&&e.instance_published_at)?Date.parse(e.instance_published_at):NaN;return isFinite(t)?t:null;};
  const haveMech=(dirs)=>dirs.some(d=>!!((mechSide(d)||{}).lifecycle));
  /* The side's state is the monitor's card_state, read straight off the feed entry. A voided observation has
     had its claim withdrawn and must not be allowed to rank (2026-10-18). */
  const sideCardState=(d)=>{const e=mechSide(d);if(!e||!e.card_state)return null;if(e.lifecycle&&e.lifecycle.voided)return null;return e.card_state.value||null;};
  const sideTrigMs=(d)=>{const lc=(mechSide(d)||{}).lifecycle;const t=(lc&&lc.trigger&&lc.trigger.reached_at)?Date.parse(lc.trigger.reached_at):NaN;return isFinite(t)?t:null;};
  const leadSide=(dirs,pubOf)=>{
    const Core=(typeof window!=="undefined"&&window.LevelUpCore)||null;
    if(!Core||!Core.pickPairSide)return dirs.length===1?dirs[0]:null;
    const at=(d)=>{let t=null;try{t=pubOf?pubOf(d):null;}catch(e){t=null;}
      return (t!==null&&t!==undefined&&isFinite(t))?t:sidePubMs(d);};
    const picked=Core.pickPairSide(dirs.map(d=>({id:d,state:sideCardState(d),trigger_ms:sideTrigMs(d),published_ms:at(d)})));
    return picked?picked.id:null;};
  const mechLiveRow=()=>{
    try{
      const Core=(typeof window!=="undefined"&&window.LevelUpCore)||null;
      if(!Core||!Core.buildAll||!MECH)return null;
      const entry=Core.buildAllByAsset(text)[ASSET];
      if(!entry||!entry.sides)return null;
      const dirs=Object.keys(entry.sides);
      if(dirs.length!==2)return null;
      /* 2026-10-24: one call to the shared order above, replacing two ad-hoc "exactly one of these"
         questions that could not separate ADA's two triggered sides at all. */
      const asked=WANT_SIDE&&dirs.indexOf(WANT_SIDE)>=0?WANT_SIDE:null;
      const want=asked||(haveMech(dirs)?leadSide(dirs,d=>{
        const sr=(entry.sides[d]||{}).setup_row||{};
        return (sr.utcMs!==null&&sr.utcMs!==undefined)?sr.utcMs:null;}):null);
      if(!want)return null;
      const pt=entry.sides[want].published_text||{};
      const ts=pt.timestamp_text||"", t1=(pt.triggers||[])[0]||"";
      if(!ts)return null;
      return rows.find(r=>get(r,"timestamp")===ts&&get(r,"trigger 1")===t1)||rows.find(r=>get(r,"timestamp")===ts)||null;
    }catch(e){return null;}
  };
  const liveRow=mechLiveRow();
  const cur=(liveRow&&auth.indexOf(liveRow)>=0?liveRow:(auth[auth.length-1]||rows[rows.length-1])),prevAuth=auth[auth.length-2];
  const upto=rows.slice(0,rows.indexOf(cur)+1).reverse();
  const setupRows=upto.filter(r=>!isPC(r));
  // 2026-10-04: this script's own S-selection had never picked up the T-07 fix already applied to the shared
  // core copy below (see its "T-07" comment) - a levels-free admin-update row with its own WHY text (e.g. an
  // "ADMIN UPDATE - Trigger Confirmed" or "...Reverted to Watching" correction) was outranking the real,
  // level-bearing Chelsea setup row right behind it, so the ladder vanished and the H1/headline showed the
  // correction's own wording instead of the real setup. Split into two clauses, same priority order as T-07:
  // a leveled CHELSEA SETUP row always wins over a WHY-only one.
  /* THE WHOLE PAGE FOLLOWS THE LIVE SIDE (2026-10-23, Angela: "btc shows long when it is a short trigger").
     On a two-sided setup the row picked here decides the H1, the status banner, the published-setup stamp, the
     levels diff and the media - not just the ladder. BTC|SHORT triggered; BTC|LONG was retired by that very
     sibling; and the LONG led the page because Chelsea had submitted it two seconds later and the choice below
     is recency-based. Mechanical evidence outranks the clock, so it is applied HERE rather than downstream,
     which keeps everything derived from S consistent by construction.

     Degrades silently: no feed, no LevelUpCore, or no pair -> mechLiveRow() returns null and S is exactly what
     it has always been. */
  const S=(liveRow&&setupRows.indexOf(liveRow)>=0?liveRow:null)||setupRows.find(r=>srcType(r)==="CHELSEA SETUP"&&hasLevels(r))||setupRows.find(r=>srcType(r)==="CHELSEA SETUP"&&get(r,"why"))||setupRows.find(hasLevels)||setupRows.find(r=>get(r,"why"))||cur;
  const carried=S!==cur;
  const [bcls,btxt]=STATUS(get(cur,"status"));const closed=/closed|invalid/i.test(get(cur,"status"));const paused=/watch|no trade/i.test(get(cur,"status"));
  const L=levels(S);const img=chartImg(get(S,"chart image"),get(S,"chart link"));const vm=driveId(get(S,"voice"));
  const P=rows.filter(r=>!isPC(r)&&hasLevels(r)&&rowTs(r)<rowTs(S)).pop();
  const ld=P?diffLevels(S,P):[];
  const noTradeLike=/no trade|closed|invalid/i.test(get(cur,"status"));
  const days=carried?Math.max(0,Math.round((rowTs(cur)-rowTs(S))/86400000)):0;

  let h=`<div class="banner ${bcls}"><span>${btxt}</span><small>CURRENT STATUS · set ${stamp(get(cur,"timestamp"))} ${srcBadge(srcType(cur))}</small></div>`;
  const st0=get(cur,"status");const rawHl=get(cur,"headline");
  const statusWord=/invalid/i.test(st0)?"INVALIDATED":/closed/i.test(st0)?"CLOSED":/no trade/i.test(st0)?"NO TRADE RIGHT NOW":btxt;
  const hasSetup=!!(hasLevels(S)||get(S,"why"));
  // Prefer cur's own headline, but fall back to S's (the real underlying setup, now correctly resolved above) -
  // an admin correction's headline ("...Reverted to Watching") never carries the "Long/Short Watch" phrase the
  // way a real Chelsea setup headline does, so without this fallback a corrected asset's title would read the
  // correction's own wording instead of matching every other Watching asset's "Long Watch"/"Short Watch".
  const dirHl=bcls==="b-active"?"Long":bcls==="b-short"?"Short":bcls==="b-watch"?(watchLabel(rawHl)||watchLabel(get(S,"headline"))):null;
  h+=`<div class="head"><div><div class="kicker">LEVEL UP CRYPTO · ${noTradeLike?"CURRENT STATUS":"LIVE SETUP"}</div><h1>${esc(ASSET)} <em>${esc(noTradeLike?statusWord:(dirHl||cleanHeadline(ASSET,rawHl)||"SETUP"))}</em></h1><div class="rule"></div><div class="dateline" id="dateline">Status set ${stamp(get(cur,"timestamp"))}</div></div><div class="logo"></div></div>`;
  if(noTradeLike){
    h+=`<div class="tl"><div><b>Current status</b><span>${esc(btxt)} · set ${stamp(get(cur,"timestamp"))} ${srcBadge(srcType(cur))}</span></div>${rawHl?`<div><b>Status note</b><span>${esc(rawHl)}</span></div>`:""}</div>`;
  }else{
    h+=`<div class="tl"><div><b>Current status</b><span>${esc(btxt)} · set ${stamp(get(cur,"timestamp"))} ${srcBadge(srcType(cur))}</span></div>`
    +`<div><b>Published setup</b><span>${hasSetup?`${stamp(get(S,"timestamp"))} ${srcBadge(srcType(S))}${carried?` <i>· history, not a current call</i>`:""}`:"none on file"}</span></div></div>`;
  }

  if(ld.length)h+=`<div class="diff ld-note">This published setup differs from the one before it (${esc(stamp(get(P,"timestamp")))}) in: ${esc(ld.join(", "))}.</div>`;
  if(cur!==S&&srcType(cur)==="ADMIN STATUS"&&get(cur,"why"))h+=`<div class="histnote"><b>ADMIN NOTE — not Chelsea's words.</b> ${esc(get(cur,"why"))}</div>`;
  if(closed){h+=`<div class="sect"><div class="bar"></div><h2>What happened</h2></div><div class="lesson"><div class="wl">Outcome</div><h3>${esc(get(cur,"outcome")||"Setup closed")}</h3><div class="wl" style="margin-top:14px">The lesson</div><p>${esc(get(cur,"lesson")||"—")}</p></div>`;}

  const media=()=>{let x="";
    if(img)x+=`<div class="chart"><img src="${img}" alt="Chelsea's chart"></div>`;
    const clUrl=safeUrl(get(S,"chart link"));
    if(clUrl)x+=`<div class="btnrow"><a class="btn" href="${esc(clUrl)}" target="_blank" rel="noopener noreferrer">Open interactive chart${carried?" (setup of "+esc(stamp(get(S,"timestamp")))+")":""}</a></div>`;
    if(vm)x+=`<div class="card soft"><h3>Chelsea's read — voice</h3><iframe class="audio" src="https://drive.google.com/file/d/${vm}/preview" allow="autoplay"></iframe></div>`;
    return x;};
  /* THE DISCLAIMERS BELONG TO THE PAGE, NOT TO A LADDER (Ang, 2026-11-06).
     They used to be emitted INSIDE this function, immediately after the ladder rows. That was correct while
     the page drew one ladder; now that a pair draws two side by side, emitting them here printed the same
     "Not financial advice" block twice, in two columns, a few hundred pixels apart. Ang's rule for the
     side-by-side layout is that shared items appear once - the chart, Chelsea's voice note and these. So
     they moved OUT of setupHTML and are emitted once by bodyHTML() below, beneath both columns.
     They are not weaker for being stated once: they now sit at the end of the whole page, which is where a
     member stops reading, instead of halfway down one of two columns. */
  const sharedDisclaimerHTML=()=>`<p class="rn page-levels-note"><b>Levels are structure, not instructions.</b> Price reaching a level is information. Whether it becomes an entry is your decision and your risk.</p><div class="dyor"><b>&#9888; Not financial advice</b><p>Chelsea is not a financial advisor. Every level above is an assumption about what the market may do next &mdash; never a guarantee, and never a promise of a result. Do your own research, size your own risk, and make your own decision. The outcome is yours.</p></div>`;
  /* Takes the row to render, so the same function can draw BOTH sides of a two-sided setup (2026-10-21).
     `primary` keeps id="ladder" on the LEADING side, because the page-top mech panels (market evidence,
     trigger readiness, entry strength, the six-line note) anchor on that id and describe the side the
     headline speaks for. Every ladder, leading or not, now carries `data-dir` and its own live price -
     see livePrice() and the per-ladder passes in mech-feed. `dir` is null on a single-sided asset. */
  const setupHTML=(Srow,primary,dir)=>{let x="";const Lrows=levels(Srow);
    if(get(Srow,"why"))x+=`<div class="sect"><div class="bar"></div><h2>Why</h2></div><div class="card"><p>${esc(clarifyPileLanguage(get(Srow,"why")))}</p></div>`;

    if(T.length){x+=`<div class="sect"><div class="bar"></div><h2>The Levels</h2></div>`;T.forEach((t,i)=>x+=`<div class="card soft"><h3>Trigger ${i+1}</h3><p>${esc(t)}</p></div>`);}
    if(Lrows.length){x+=`<div class="sect"><div class="bar"></div><h2>The Ladder</h2><div class="hint">live price</div></div><div class="ladder"${primary?` id="ladder"`:""}${dir?` data-dir="${esc(String(dir).toLowerCase())}"`:""}>`;
      const rowsH=Lrows.map(l=>`<div class="row" data-p="${l.price}"><div class="dot d-${l.kind}"></div><div><div class="rl">${esc(l.role)}</div><div class="rn">${esc(l.note)}</div></div><div class="rp">${fmt(l.price)}<small>${l.kind==="tp"?"target":l.kind==="stop"?"invalidation":"level"}</small></div></div>`);
      x+=rowsH.join("")+`</div>`;}
    if(get(Srow,"warning"))x+=`<div class="sect"><div class="bar"></div><h2>Warning</h2></div><div class="warn"><div class="wh">Heads up</div><div class="wb">${esc(get(Srow,"warning"))}</div></div>`;
    if(get(Srow,"confidence up")||get(Srow,"confidence down"))x+=`<div class="sect"><div class="bar"></div><h2>Confidence Check</h2></div><div class="grid2"><div class="inv up"><div class="ih">▲ Confidence up</div><div class="ib">${esc(get(Srow,"confidence up"))}</div></div><div class="inv dn"><div class="ih">▼ Confidence down</div><div class="ib">${esc(get(Srow,"confidence down"))}</div></div></div>`;
    return x;};

  /* ----------------------------------------------------------------------------------------------------
     TWO-SIDED SETUPS (2026-10-21). Chelsea published a LONG and a SHORT on AVAX and on UNI within seconds
     of each other on 2026-10-20. This page used to show one of them: it picked a single row and the other
     side's Why, levels, ladder and warning were simply absent, with nothing saying a second side existed.

     Angela chose density C on 2026-10-20 - "the side price supports expanded, the quiet side folded into a
     disclosure" - and one rule whether a side is quiet because price went the other way or because it was
     retired when its sibling fired. So: ONE page, the primary side rendered exactly as it is today, and the
     other side in a <details> underneath.

     The pairing decision is NOT made here. It comes from LevelUpCore (this page's own att-core block, the
     same parser the monitor uses), so there is exactly one implementation of the 2h window rule to keep
     right. Sides are matched back to this script's own rows by published timestamp + trigger text, which
     both parsers read from the same cells.

     WHICH SIDE IS PRIMARY: the one this page would have shown anyway - the row S already selected. The
     approved design says "order follows the meter", and the confirmation strength meter is not on the board
     yet (monitor/confirmation.js computes it; nothing renders it). Until it is, the order is recency, which
     is deterministic and is not the board judging which trade is better. Retirement-aware ordering belongs
     with the meter wiring, since both need the feed.

     Degrades safely: if LevelUpCore has not loaded yet, or the sides cannot be matched back to rows, this
     returns null and the page renders exactly as it does today. */
  const pairedSides=()=>{
    try{
      const Core=(typeof window!=="undefined"&&window.LevelUpCore)||(typeof LevelUpCore!=="undefined"&&LevelUpCore)||null;
      if(!Core||!Core.buildAllByAsset)return null;
      const entry=Core.buildAllByAsset(text)[ASSET];
      if(!entry||!entry.sides)return null;
      const rowFor=(side)=>{
        const pt=side.published_text||{};const ts=pt.timestamp_text||"",t1=(pt.triggers||[])[0]||"";
        if(!ts)return null;
        return rows.find(r=>get(r,"timestamp")===ts&&get(r,"trigger 1")===t1)||rows.find(r=>get(r,"timestamp")===ts)||null;
      };
      const byDir={};Object.keys(entry.sides).forEach(d=>{const row=rowFor(entry.sides[d]);if(row)byDir[d]=row;});
      const dirs=Object.keys(byDir);
      if(dirs.length!==2)return null;
      /* THE LIVE SIDE LEADS. Recency decided this until 2026-10-24, which on BTC meant a stopped side led
         the page by a two-second publication margin. Mechanical evidence outranks the clock, and the order
         it uses is the shared one documented above - not a second opinion about it. */
      const asked=WANT_SIDE&&dirs.indexOf(WANT_SIDE)>=0?WANT_SIDE:null;
      const byEvidence=asked||(haveMech(dirs)?leadSide(dirs,d=>{
        const r=byDir[d];const t=r?rowTs(r):NaN;return isFinite(t)?t:null;}):null);
      const pDir=byEvidence||dirs.find(d=>byDir[d]===S)||entry.primary_side||dirs[0];
      const qDir=dirs.find(d=>d!==pDir);
      return {primary:{dir:pDir,row:byDir[pDir]},quiet:{dir:qDir,row:byDir[qDir]}};
    }catch(err){return null;}
  };
  const sides=pairedSides();

  /* ----------------------------------------------------------------------------------------------------
     BOTH SIDES SIDE BY SIDE (Ang, 2026-11-06). THE DROPDOWN IS DELETED, NOT HIDDEN.

     What was here: `sideFlip()`, a <details class="sideflip"> that folded the second side of a pair behind
     a "The other side of this setup" summary. That was density C, chosen by Angela on 2026-10-20 when a
     pair was new and the quiet side was genuinely an aside.

     Why it is gone. A diamond has two live sides, and the standing rule is that one side playing out or
     being invalidated never kills the other - a 1H candle at the level can activate the second side days
     later. A collapsed <details> teaches the opposite: it says one side is the setup and the other is a
     footnote. On ADA today the short is TRIGGERED and the long is EXPIRED, and a member who never opens
     the disclosure never learns the long is dead. Both sides are now open, labelled and equal.

     THE ORDER IS THE LEAD ORDER AND NOTHING ELSE: TRIGGERED > WATCHING > FINISHED > DORMANT > EXPIRED,
     from LevelUpCore.pickPairSide via leadSide() above - the one implementation all three surfaces call.
     `sides.primary` IS the leading side, so the columns are emitted primary-then-quiet and the CSS does no
     reordering of its own. At phone width the same source order stacks, which puts the leading side first
     there too without a second rule deciding it.

     live price. Once for the page: the chart, Chelsea's voice note and the disclaimers - media() was
     already emitted once above, and the disclaimers moved out of setupHTML() to join it. */

  /* THE COLUMN'S STATUS IS NOT COMPOSED HERE. THIS IS A SLOT, AND THAT IS THE WHOLE POINT.
     (Ang + reviewer, 2026-11-06: "a column's status must use the SAME words as the page-top headline for
     that side - call the same composer; do not write a second one.")

     What was here: sideStatusHTML(), which read the side's card_state and worded it from
     LevelUpWords itself. It used the one WORDS table but it was a second COMPOSER, and the two did not
     agree: the headline reads the lifecycle and says "ACTIVE SHORT - TP1 REACHED", while this one left
     {PROGRESS} at its no-progress form and said "ACTIVE SHORT - CONDITION MET" a few hundred pixels
     below it. Ang saw both sentences on one screen on the first preview. A member cannot be expected to
     work out that they describe the same trade.

     So the base render emits an EMPTY slot carrying only the side it belongs to, and mech-feed's
     ensureSideColumnStates() fills it by calling resolveCurrentState(ASSET_, dir) - the identical
     function, with the identical arguments, that writes the headline. One composer, two surfaces.
     If mech-feed never runs (no feed, a parse failure), the slot stays empty and the column renders with
     its levels and ladder and no status - the same degradation every other ensure* pass has. */

  /* One function, both columns. `lead` only marks which one the page-top headline speaks for; it changes
     no words and decides nothing. The member-visible claim on the trailing column is its own card_state,
     not "this one matters less". */
  const sideColumnHTML=(s,lead)=>`<section class="sidecol${lead?" is-lead":""}" data-dir="${esc(String(s.dir).toLowerCase())}">`
    +`<header class="sidecol-h"><span class="dirtag d-${esc(String(s.dir).toLowerCase())}">${esc(String(s.dir).toUpperCase())}</span>`
    +`<span class="sidecol-pub">published ${esc(stamp(get(s.row,"timestamp")))}</span>`
    /* Short enough to sit on ONE line beside the tag and the timestamp. The first build read "status at
       the top of this page", which wrapped, so the leading column's header was two lines and the trailing
       one was one - and every section bar below them sat at a different height between the columns. */
    +(lead?`<span class="sidecol-badge">leads this page</span>`:"")+`</header>`
    +`<div class="sidecol-state-slot" data-dir="${esc(String(s.dir).toLowerCase())}"></div>`
    +setupHTML(s.row,lead,s.dir)
    +`</section>`;

  const bodyHTML=()=>(sides
    ?`<p class="sidepair-note">Chelsea published both sides of this setup. Each column below is its own trade with its own status, levels and ladder - one side playing out does not end the other.</p>`
      +`<div class="sidepair">${sideColumnHTML(sides.primary,true)}${sideColumnHTML(sides.quiet,false)}</div>`
    :setupHTML(S,true,null))

  if(noTradeLike){
    if(hasSetup){
      h+=`<div class="sect"><div class="bar"></div><h2>Published setup</h2><div class="hint">${esc(stamp(get(S,"timestamp")))}</div></div>`;
      h+=`<div class="histnote"><b>HISTORICAL — NOT A CURRENT TRADE CALL.</b> The current status is <b>${esc(btxt)}</b>. This is Chelsea's most recent published setup for ${esc(ASSET)}, from ${esc(stamp(get(S,"timestamp")))} ${srcBadge(srcType(S))}${days?` (${days} day${days===1?"":"s"} before the current status)`:""}. It is shown so nothing is lost; its levels may no longer apply.</div>`;
      h+=media();
      h+=`<div class="faded">${bodyHTML()}</div>`;
    }else{
      h+=`<div class="sect"><div class="bar"></div><h2>Published setup</h2></div><div class="histnote">No published setup on file for ${esc(ASSET)}.</div>`+media();
    }
  }else{
    if(carried){
      h+=`<div class="sect"><div class="bar"></div><h2>Most recent published setup</h2><div class="hint">published · ${esc(stamp(get(S,"timestamp")))}</div></div>`;
      h+=`<div class="histnote"><b>STATUS UPDATE (${esc(srcType(cur))}) — NOT A NEW CALL FROM CHELSEA.</b> The levels below are Chelsea's published setup from ${esc(stamp(get(S,"timestamp")))}.</div>`;
    }
    h+=media();
    h+=`<div class="${(closed||paused)?"faded":""}">${bodyHTML()}</div>`;
  }

  // 2026-10-16 (Angela, explicit, per Chelsea): the per-asset History list below was removed from display -
  // it made the page look messy/confusing. Every row is still preserved in the Sheet/feed for Chelsea's own
  // record and future content use; this just stops rendering it on the public detail page. `rows` itself is
  // untouched so nothing upstream of this view is affected.
  h+=`<div class="foot"><div class="f1">LEVEL UP ⚡ · NOT FINANCIAL ADVICE · DYOR</div><div class="f2">Not financial advice. For educational purposes only. Trading involves risk. Protect your capital. Always use a stop loss. Leverage is a personal choice based on your own risk tolerance. Don't compare trades or position sizes.</div></div>`;
  $("#app").innerHTML=h;

}

async function livePrice(L){
  // 2026-09-29 fix: this used to resolve a CoinGecko id (hardcoded map, else a /search lookup) and read
  // /simple/price - CoinGecko's public API is failing ("Failed to fetch", live-verified) for at least some
  // assets, which silently broke this row (an empty/failed fetch just returns, per the pre-existing `if(!px)
  // return` below - no error shown, no stale indicator, it just never appears). Rather than debug or replace
  // CoinGecko, this now reads the SAME established, reliable, key-free Binance/Coinbase price source the rest
  // of this page already depends on (LevelUpAttention.fetchPrices(), att-module - no second pricing engine).
  const A=(typeof window!=="undefined"&&window.LevelUpAttention)||(typeof LevelUpAttention!=="undefined"&&LevelUpAttention)||null; if(!A)return;
  let px=0;
  try{const r=await A.fetchPrices([ASSET]);px=(r.prices&&r.prices[ASSET])||0;}catch(e){}
  if(!px)return;
  const t=new Date().toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"});
  const dl=$("#dateline");if(dl)dl.innerHTML=dl.textContent.split("  ·  LIVE")[0]+`  ·  LIVE ${fmt(px)} @ ${t} EST`;
  /* EVERY LADDER ON THE PAGE GETS THE LIVE ROW (Ang, 2026-11-06, the side-by-side layout).
     This read `$("#ladder")` and placed a single NOW row, which was right while a pair folded its second
     side into a dropdown. With two ladders open at once, the trailing column had no live price at all -
     and a ladder without the NOW line is the one thing a member cannot read, because where price sits
     relative to the levels is the whole point of the ladder.
     STILL ONE FETCH. The two sides are two sides of the SAME asset, so there is one price and one call to
     fetchPrices() above; this loop only places that one number in each ladder. That is the direction fix
     plan step 6 is going (one price timer per page), not against it.
     The NOW row is built per ladder, so `#nowp` / `#nowts` became CLASSES - two elements cannot share an
     id, and the old ids would have made the second column's row unaddressable. */
  const lads=[...document.querySelectorAll(".ladder")];
  if(!lads.length)return;
  const nowStamp=new Date().toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",second:"2-digit"});
  for(const lad of lads){
    let row=lad.querySelector(".row.now");
    if(!row){row=document.createElement("div");row.className="row now";row.innerHTML=`<div class="dot d-now"></div><div><div class="rl">NOW <span class="now-ts"></span></div><div class="rn">Live price. Everything above this line is earned, not assumed.</div></div><div class="rp"><span class="now-px"></span><small>live</small></div>`;}
    const pxEl=row.querySelector(".now-px");if(pxEl)pxEl.textContent=fmt(px);
    const tsEl=row.querySelector(".now-ts");if(tsEl)tsEl.textContent=`(${nowStamp} ET)`;
    const rows=[...lad.querySelectorAll(".row:not(.now)")];let placed=false;
    for(const r of rows){if(parseFloat(r.dataset.p)<px){lad.insertBefore(row,r);placed=true;break;}}
    if(!placed)lad.appendChild(row);
  }
}
load();setInterval(load,60000);setInterval(()=>livePrice(),30000);

<!-- THE WORDS (step 4, 2026-11-06). The monitor publishes a card_state per side; levelup-words.js is the

<script id="att-module">

 * LevelUp board — trigger-proximity ("LIVE ATTENTION") logic.  STAGING.

 * This module does NOT define trigger distance itself. It re-uses:
 *   - LevelUpCore.buildAll / LevelUpCore.edges  (the shared parser the monitor uses; parity-tested against the deployed board)
 *   - the monitor's attention-band definitions from monitor/engine.js (BAND_NAMES, bandOrd, sidePre, distTo, and the
 *     "nearest not-yet-passed trigger, distance to its NEAR edge, 0 when inside the zone" rule).
 * The four one-line helpers below are byte-for-byte the engine's; test/att-module.test.js (ATT-17) fails if they
 * ever diverge, and ATT-4 pins every band and distance this module reports over a grid of prices on every asset.
 * That suite runs this block unmodified out of the HTML, so it tests what the board serves, not a copy of it.
 *
 * Scope: mechanical price proximity to Chelsea's PUBLISHED trigger zone. It never says entered/triggered/valid and never

  /* ---- AND THIS ONE TOO: IDENTICAL to monitor/engine.js SCALE_SLIP_FACTOR (line 603) ----

     AN OFF-SCALE PRICE IS THE WRONG MARKET, NOT A SIGNAL (2026-11-09, Ang: "beam it should not be
     watching"). Chelsea published BEAM at 05:49 with levels around $0.0040. Coinbase's BEAM-USD agreed
     ($0.004008). Binance's BEAMUSDT is a DIFFERENT token at $0.0652, the browser's price source reached
     for it first, and the card told members "1521.9% past the floor - Cleared the floor - price is
     currently above the real floor ($0.0652 vs $0.00402), watching for a 1H candle to open there and
     confirm". Price was in fact below the floor. The strongest claim this surface makes, on the wrong
     asset's price.

     The MONITOR already refuses this exact thing - scaleSlip() in engine.js, same 5x bar, which is how
     SHIB was stopped on 2026-11-02 - but it never sees the browser's price, so it could not help. This is
     the same rule on the same constant, applied where the bad number actually appears. It is mirrored, not

     `BTC`. This module used to build exchange symbols out of whatever key it was handed, so the first time
     the shared parser was switched in, every paired setup asked Binance for `BTC|LONGUSDT`, received nothing,
     and rendered as "no live price" - LIVE ATTENTION went from four tiles to zero with no error anywhere.
     From here on a ticker is derived from the ASSET and a price is returned under the KEY it was asked for.
     Single-sided assets are untouched: assetOf('SOLO') === 'SOLO'. */
  const assetOf = (k) => String(k).split('|')[0];

  /* Which statuses get a trigger-proximity card. The engine computes TRIGGER bands for WATCHING and NO_TRADE; the board
     shows students only WATCHING (a No Trade card is not actionable). Pass {includeNoTrade:true} to mirror the engine exactly. */
  function applicable(setup, opts) {
    const o = opts || {};
    const dir = setup.direction && setup.direction.value;
    const st = setup.status && setup.status.class;
    if (!dir) return false;
    return st === 'WATCHING' || (!!o.includeNoTrade && st === 'NO_TRADE');
  }

  /* Returns one of:
       {state:'NA'}                                    not a watching setup / no direction / no numeric trigger
       {state:'NOPRICE'}                               price unavailable
       {state:'APPROACHING', distance_pct, band, band_ord, level_id, near_edge, far_edge, direction}
       {state:'INSIDE',      distance_pct:0, band:'MAXIMUM', band_ord:4, ...}
       {state:'PASSED', ...}                           price is beyond EVERY published trigger zone (engine: bands.TRIGGER = null)  */
  function triggerProximity(setup, price, opts) {
    if (!applicable(setup, opts)) return { state: 'NA' };
    const dir = setup.direction.value;
    const trig = setup.levels.filter((l) => l.kind === 'trigger' && l.state === 'present' && l.zone);
    if (!trig.length) return { state: 'NA' };
    if (price == null || !isFinite(price) || price <= 0) return { state: 'NOPRICE', direction: dir, triggers: trig.map((l) => ({ id: l.id, zone: l.zone })) };
    /* A price from the wrong market is NO price (2026-11-09). It takes the existing NOPRICE path rather
       than a new state, because "we cannot say where price is relative to this trigger" is exactly what
       NOPRICE already means and every caller already renders it honestly. `off_scale` is carried only so a
       surface CAN say why if it wants to; nothing is required to read it. */
    if (trig.some((l) => offScale(l.zone.low, price))) {
      return { state: 'NOPRICE', off_scale: true, direction: dir, triggers: trig.map((l) => ({ id: l.id, zone: l.zone })) };
    }
    let best = null;
    for (const level of trig) {
      const ed = C.edges(level, dir); const s = sidePre(price, ed);
      if (s === 'beyond') continue;
      const d = s === 'inside' ? 0 : distTo(price, ed.near);
      if (!best || d < best.dist) best = { level, ed, dist: d, inside: s === 'inside' };
    }
    if (!best) {
      const l = trig[trig.length - 1]; const ed = C.edges(l, dir);
      return { state: 'PASSED', direction: dir, level_id: l.id, near_edge: ed.near, far_edge: ed.far, zone: l.zone, past_pct: distTo(price, ed.far) };
    }
    const ord = bandOrd(best.dist);
    return { state: best.inside ? 'INSIDE' : 'APPROACHING', distance_pct: best.dist, band: BAND_NAMES[ord], band_ord: ord, level_id: best.level.id, near_edge: best.ed.near, far_edge: best.ed.far, zone: best.level.zone, direction: dir, inside: best.inside };
  }

  /* Ordering for the LIVE ATTENTION list: inside the zone first, then ascending % distance, then "past the zone",
     then no-price. Ties broken alphabetically. */
  const RANK = { INSIDE: 0, APPROACHING: 1, PASSED: 2, NOPRICE: 3, NA: 4 };
  function sortAttention(items) {
    return items.slice().sort((a, b) => (RANK[a.prox.state] - RANK[b.prox.state])
      || ((a.prox.distance_pct || 0) - (b.prox.distance_pct || 0))
      || ((a.prox.past_pct || 0) - (b.prox.past_pct || 0))
      || String(a.asset).localeCompare(String(b.asset)));
  }

  /* Display: one decimal, never rounds a non-zero distance down to "0.0". */
  function fmtPct(d) {
    if (d == null || !isFinite(d)) return '–';
    if (d === 0) return '0.0';
    if (d < 0.1) return '<0.1';
    return d.toFixed(1);
  }
  function fmtPrice(p) {
    if (p == null || !isFinite(p)) return '–';
    const a = Math.abs(p);
    if (a >= 1000) return p.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (a >= 1) return p.toFixed(a >= 100 ? 2 : 3);
    if (a >= 0.01) return p.toFixed(4);
    return p.toPrecision(3);
  }
  const zoneText = (z) => (z ? (z.low === z.high ? fmtPrice(z.low) : fmtPrice(z.low) + '–' + fmtPrice(z.high)) : '–');

  /* ACTIVE NOW: the authority is the Sheet's CURRENT ADMINISTRATIVE STATUS (core statusClass of the newest status row — the same
     value the board banner uses). Nothing about trade state is recalculated or inferred from price. */
  function activeNow(setups) {
    const out = [];
    Object.keys(setups).sort().forEach((k) => {
      const s = setups[k]; const cls = s.status && s.status.class;
      /* `.key` indexes `setups` and the price map; `.asset` is the TICKER, which is what gets compared
         against ticker lists and what a price is fetched for. They are the same string for a single-sided
         asset and differ for a side of a pair - see assetOf() below. */
      if (cls === 'ACTIVE_LONG' || cls === 'ACTIVE_SHORT') out.push({ key: k, asset: assetOf(k), cls, side: cls === 'ACTIVE_LONG' ? 'long' : 'short', label: sheetStatusLabel(cls), status_text: s.status.text, status_iso: s.status.iso || null, setup: s });
    });
    return out;
  }
  /* MEMBER-FACING STATUS WORDS COME FROM levelup-words.js, NEVER FROM HERE (Ang, 2026-11-09).
     These two were literals in this block, in BOTH pages, which is the second-writer shape the words file
     exists to end - the card_state wording was changed on 2026-11-07 and these did not move, because
     nothing connected them. They label CHELSEA'S administrative status, not a card_state, so they live
     under SHEET_STATUS_LABELS rather than in the card_state table.
     `W` is the words table handed in by the UMD above. Without it these return null and the caller shows
     nothing - the same "say nothing rather than invent wording" every other surface here follows, and the
     reason the literals are not kept as a fallback: a fallback IS a second copy. */
  const sheetStatusLabel = (cls) => {
    const L = W && W.SHEET_STATUS_LABELS;
    if (!L) return null;
    return cls === 'ACTIVE_SHORT' ? L.active_short : L.active_long;
  };
  const triggeredLabel = (cls) => {
    const L = W && W.SHEET_STATUS_LABELS;
    const lbl = sheetStatusLabel(cls);
    return (L && lbl) ? W.fill(L.triggered, { LABEL: lbl }) : null;
  };

  /* Visual tier from the engine band (0..4) — presentation only. */
  function tier(prox) {
    if (prox.state === 'INSIDE') return 4;
    if (prox.state === 'APPROACHING') return prox.band_ord;
    return -1;
  }

  /* ---- prices (browser): Binance public batch (the monitor's primary), per-symbol retry, Coinbase per-asset fallback
         (the monitor's confirmation source). No CoinGecko, no keys. ---- */
  async function fetchPrices(keys, fetchFn, symbolOverrides) {
    const g = typeof self !== 'undefined' ? self : globalThis;
    const f = fetchFn || (typeof g.fetch === 'function' ? g.fetch.bind(g) : null);
    if (!f) return { prices: {}, sources: {}, at: 0 };
    const ov = symbolOverrides || {};
    const out = {}; const src = {};
    const sym = (k) => { const a = assetOf(k); return (ov[a] && ov[a].binance) || (a + 'USDT'); };
    /* One entry per distinct ASSET, remembering every key that wants it: a two-sided asset therefore costs
       one request instead of two, and both of its sides receive the same price. */
    const want = []; const keysFor = {};
    for (const k of keys) { const a = assetOf(k); if (!keysFor[a]) { keysFor[a] = []; want.push(a); } keysFor[a].push(k); }
    const fill = (a, p, s) => { if (p > 0) keysFor[a].forEach((k) => { out[k] = p; src[k] = s; }); };
    const priced = (a) => out[keysFor[a][0]] > 0;
    try {
      const url = 'https://data-api.binance.vision/api/v3/ticker/price?symbols=' + encodeURIComponent(JSON.stringify(want.map(sym)));
      const r = await f(url); if (r.ok) { const j = await r.json(); const m = {}; j.forEach((x) => { m[x.symbol] = parseFloat(x.price); }); want.forEach((a) => { fill(a, m[sym(a)], 'binance'); }); }
    } catch (e) { /* fall through to per-asset */ }
    for (const a of want) {
      if (priced(a)) continue;
      try { const r = await f('https://data-api.binance.vision/api/v3/ticker/price?symbol=' + sym(a)); if (r.ok) { const p = parseFloat((await r.json()).price); if (p > 0) { fill(a, p, 'binance'); continue; } } } catch (e) { /* next */ }
      try { const cb = (ov[a] && ov[a].coinbase) || (a + '-USD'); const r = await f('https://api.exchange.coinbase.com/products/' + cb + '/ticker'); if (r.ok) { const p = parseFloat((await r.json()).price); if (p > 0) { fill(a, p, 'coinbase'); } } } catch (e) { /* unavailable */ }
    }
    return { prices: out, sources: src, at: Date.now() };
  }

  return { BAND_NAMES, bandOrd, sidePre, distTo, SCALE_SLIP_FACTOR, offScale, applicable, triggerProximity, sortAttention, fmtPct, fmtPrice, zoneText, tier, fetchPrices, RANK, activeNow, triggeredLabel, sheetStatusLabel };
});

</script>

/* "% TO TRIGGER" chip on the per-asset page (STAGING). Appended after the existing page script; baseline untouched.
   Uses the same shared core + monitor band definitions as the landing page. Shows only for a WATCHING setup with a numeric trigger. */
(function () {
  'use strict';
  try {
    var A = window.LevelUpAttention, C = window.LevelUpCore;
    if (!A || !C) return;
    var CSV = (typeof SHEET_CSV !== 'undefined' && SHEET_CSV) || '';
    var ASSET_ = ((new URLSearchParams(location.search)).get('asset') || 'AAVE').toUpperCase();
    var app = document.getElementById('app');
    if (!CSV || !app) return;
    var setup = null, ps = { prices: {}, sources: {}, at: 0 }, STALE_MS = 150000;
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var srcName = { binance: 'Binance', coinbase: 'Coinbase' };

    function chipHtml() {
      if (!setup) return '';
      var cls = setup.status && setup.status.class;   // Active statuses: the label comes from the Sheet's current administrative status only
      if (cls === 'ACTIVE_LONG' || cls === 'ACTIVE_SHORT') return '<div class="att-chip act ' + (cls === 'ACTIVE_SHORT' ? 'act-short' : 'act-long') + '" id="att-chip"><span>' + A.triggeredLabel(cls) + '</span></div>';
      var fresh = ps.at && (Date.now() - ps.at) < STALE_MS; var price = fresh ? ps.prices[ASSET_] : null;
      var p = A.triggerProximity(setup, price); if (p.state === 'NA') return '';
      var lvl = ' · Chelsea trigger $' + A.zoneText(p.zone || (setup.levels.filter(function (l) { return l.kind === 'trigger' && l.zone; })[0] || {}).zone);
      var live = price ? ' · live $' + A.fmtPrice(price) + ' (' + (srcName[ps.sources[ASSET_]] || 'live') + ')' : '';
      if (p.state === 'APPROACHING' || p.state === 'INSIDE') {
        var t = A.tier(p), lab = p.state === 'INSIDE' ? 'TRIGGER ZONE' : (p.band_ord >= 1 ? 'ATTENTION LEVEL: ' + p.band : '');
        return '<div class="att-chip tier-' + t + '" id="att-chip" data-tier="' + t + '"><b>' + A.fmtPct(p.distance_pct) + '%</b><span>to trigger</span><small>' + esc(lab) + live + lvl + '</small></div>';
      }
      // 2026-10-03 (Angela, explicit): removed. This repeated the same live-price-vs-level comparison the
      // ladder below already shows plainly, and when the trigger zone was mis-parsed (see the scanNumbers
      // window fix above) it rendered as a flatly wrong "price past trigger zone / Chelsea trigger $0.00" -
      // actively misleading instead of merely redundant. Falls through to the same empty state as NA.
      if (p.state === 'PASSED') return '';
      return '<div class="att-chip" id="att-chip"><span>live price unavailable</span><small>distance to trigger hidden' + lvl + '</small></div>';
    }
    function ensure() {
      var banner = app.querySelector('.banner'); if (!banner) return;
      var html = chipHtml(); var old = document.getElementById('att-chip');
      if (!html) { if (old) old.remove(); return; }
      var d = document.createElement('div'); d.innerHTML = html; var chip = d.firstChild;
      if (old) { if (old.outerHTML === chip.outerHTML) return; old.replaceWith(chip); } else banner.parentNode.insertBefore(chip, banner.nextSibling);
    }
    var obs = new MutationObserver(function () { obs.disconnect(); ensure(); obs.observe(app, { childList: true }); });
    function loadSheet() { return fetch(CSV + (CSV.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) { setup = C.buildAllByAsset(t)[ASSET_] || null; }).catch(function () {}); }
    function loadPrice() { if (!setup || A.triggerProximity(setup, 1).state === 'NA') { ensure(); return Promise.resolve(); } return A.fetchPrices([ASSET_]).then(function (r) { if (r.prices[ASSET_]) ps = r; ensure(); }).catch(function () { ensure(); }); }
    loadSheet().then(loadPrice);
    setInterval(function () { loadSheet().then(loadPrice); }, 60000);
    setInterval(loadPrice, 30000);
    setInterval(ensure, 15000);
    obs.observe(app, { childList: true });
    window.__attentionChip = { ensure: ensure };
  } catch (e) { if (window.console) console.warn('attention chip disabled:', e); }
})();
