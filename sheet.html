<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Up — Live Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#FA0398;--pink-soft:#FFE8F3;--pink-line:#F9C8E3;--ink:#111114;--gray:#6B7280;--gray2:#9CA3AF;--orange:#FF9500;--orange-d:#D97A00;--yellow:#E5A00D;--green:#22C55E;--green-d:#15803D;--red:#EF4444;--red-d:#B91C1C;--panel:linear-gradient(180deg,#1C1C25,#2B2B37)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#ECECF1;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
body{display:flex;justify-content:center;padding:24px 12px}
.sheet{position:relative;width:100%;max-width:1080px;background:#fff;overflow:hidden;box-shadow:0 18px 60px rgba(13,13,15,.16)}
.sheet::before,.sheet::after{content:"";position:absolute;left:0;right:0;height:7px;z-index:6;background:linear-gradient(90deg,var(--orange),var(--pink))}
.sheet::before{top:0}.sheet::after{bottom:0}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.g1{width:620px;height:620px;top:-260px;right:-200px;background:radial-gradient(circle,rgba(250,3,152,.13),transparent 68%)}
.g2{width:520px;height:520px;top:180px;left:-240px;background:radial-gradient(circle,rgba(250,3,152,.10),transparent 68%)}
.inner{position:relative;z-index:2;padding:38px 40px 30px}
.banner{margin:0 0 22px;padding:14px 18px;border-radius:12px;font-family:Archivo;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.banner small{font-family:Inter;font-weight:600;font-size:12px;letter-spacing:.02em;text-transform:none;opacity:.85}
.b-active{background:rgba(34,197,94,.12);border:2px solid var(--green);color:var(--green-d)}
.b-short{background:rgba(239,68,68,.10);border:2px solid var(--red);color:var(--red-d)}
.b-watch{background:#FFF4E0;border:2px solid var(--orange);color:var(--orange-d)}
.b-none{background:#F3F4F6;border:2px solid var(--gray2);color:#374151}
.b-closed{background:#F3F4F6;border:2px solid #374151;color:#111}
.b-invalid{background:rgba(239,68,68,.10);border:2px solid var(--red);color:var(--red-d)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--pink);text-transform:uppercase}
h1{font-family:Archivo;font-weight:900;font-size:clamp(34px,6.4vw,62px);line-height:.94;letter-spacing:-.02em;margin:10px 0 0;text-transform:uppercase}
h1 em{font-style:normal;color:var(--pink)}
.rule{height:8px;background:var(--pink);width:260px;margin:14px 0 12px;border-radius:2px}
.dateline{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--gray);letter-spacing:.04em;line-height:1.6}
.logo{flex:0 0 auto;width:96px;height:92px;filter:drop-shadow(0 0 12px rgba(250,3,152,.45))}.logo img{width:100%;height:100%;object-fit:contain}
.sect{display:flex;align-items:center;gap:12px;margin:34px 0 16px}.sect .bar{width:7px;height:26px;background:var(--pink);border-radius:2px}
.sect h2{font-family:Archivo;font-weight:800;font-size:20px;letter-spacing:.03em;text-transform:uppercase}.sect .hint{margin-left:auto;font-size:11px;font-weight:600;color:var(--gray2);letter-spacing:.06em;text-transform:uppercase}
.card{border:2px solid var(--pink);border-radius:14px;padding:20px 22px;background:#fff;box-shadow:0 10px 28px rgba(13,13,15,.07);margin-bottom:12px}
.card.soft{border-color:var(--pink-line);box-shadow:none}
.card h3{font-family:Archivo;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.card p{font-size:14px;line-height:1.65;color:#2A2A32;white-space:pre-line}
.lesson{background:var(--panel);border:2px solid var(--pink);border-radius:14px;padding:22px 24px;color:#D6D6DE;box-shadow:0 0 22px rgba(250,3,152,.16);margin-bottom:14px}
.lesson .wl{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--pink);text-transform:uppercase}
.lesson h3{font-family:Archivo;font-weight:800;font-size:20px;color:#fff;margin:8px 0 10px;text-transform:uppercase}
.lesson p{font-size:14px;line-height:1.7;white-space:pre-line}
.lesson b{color:#fff}
.chart{border:2px solid var(--pink);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:12px}
.chart img{display:block;width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.btn{font-family:Inter;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;border-radius:999px;border:2px solid var(--pink);background:#fff;color:var(--pink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--pink);color:#fff}
.ladder{border:2px solid var(--pink);border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 10px 28px rgba(13,13,15,.07)}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:15px 20px;border-bottom:1px solid #F0F0F4}
.row:last-child{border-bottom:none}.row.now{background:var(--pink-soft);border-top:2px solid var(--pink);border-bottom:2px solid var(--pink)}
.dot{width:14px;height:14px;border-radius:50%;margin:0 auto}
.d-tp{background:var(--green)}.d-res{background:var(--yellow)}.d-now{background:var(--pink);animation:pulse 1.8s infinite}.d-sup{background:var(--gray2)}.d-stop{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,3,152,.6)}70%{box-shadow:0 0 0 14px rgba(250,3,152,0)}100%{box-shadow:0 0 0 0 rgba(250,3,152,0)}}
.rl{font-family:Archivo;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}.rn{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.45}
.rp{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:23px;text-align:right;white-space:nowrap}.rp small{display:block;font-size:10px;font-weight:500;color:var(--gray2);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.faded .ladder,.faded .card{opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inv{border-radius:12px;padding:16px 18px;border:2px solid}.inv.up{border-color:var(--green);background:rgba(34,197,94,.07)}.inv.dn{border-color:var(--red);background:rgba(239,68,68,.06)}
.inv .ih{font-family:Archivo;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}.inv.up .ih{color:var(--green-d)}.inv.dn .ih{color:var(--red-d)}.inv .ib{font-size:13px;line-height:1.6;white-space:pre-line}
.warn{border-radius:12px;padding:16px 18px;background:#FFF4E0;border:2px solid var(--orange);margin-bottom:12px}.warn .wh{font-family:Archivo;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-d);margin-bottom:6px}.warn .wb{font-size:13.5px;line-height:1.6;color:#3A2E18;white-space:pre-line}
.diff{font-size:12px;color:var(--orange-d);background:#FFF4E0;border:1px solid var(--orange);border-radius:8px;padding:8px 12px;margin:10px 0}
.hist{border:2px solid var(--pink-line);border-radius:12px;padding:16px 18px;margin-bottom:10px;background:#fff}
.hist .hh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.hist .hv{font-family:Archivo;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.hist .hd{font-family:"JetBrains Mono";font-size:11px;color:var(--gray)}
.hist .pill{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid}
.hist .lv{font-size:12px;color:var(--gray);line-height:1.6}.hist .out{font-size:13px;margin-top:8px;line-height:1.6;white-space:pre-line}
.hist .out b{color:var(--pink)}
.foot{margin-top:32px;padding-top:18px;border-top:2px solid var(--pink-line);text-align:center}.foot .f1{font-family:Archivo;font-weight:800;font-size:13px;letter-spacing:.18em;color:var(--pink);text-transform:uppercase}.foot .f2{font-size:11.5px;color:var(--gray);margin-top:8px;line-height:1.6;max-width:720px;margin-left:auto;margin-right:auto}
.empty{padding:60px 20px;text-align:center;color:var(--gray)}
audio,iframe.audio{width:100%;margin-top:10px;border:0;height:80px}
@media(max-width:640px){.inner{padding:30px 18px 24px}.grid2{grid-template-columns:1fr}.head{flex-direction:column-reverse;align-items:flex-start}.row{grid-template-columns:40px 1fr auto;padding:13px 14px;gap:10px}.rp{font-size:19px}}
</style>
</head>
<body>
<div class="sheet"><div class="glow g1"></div><div class="glow g2"></div>
<div class="inner" id="app"><div class="empty">Loading the latest read…</div></div>
</div>

<script>
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/1MqfOX5EzRYvjQbd6U9RZTZ2ujm9_xx0LoT5rAzZxcPI/gviz/tq?tqx=out:csv&gid=1165837241";
const LOGO_SRC  = "bb_logo_pink.png";
const GECKO = {AERO:"aerodrome-finance",AAVE:"aave",BTC:"bitcoin",ETH:"ethereum",SOL:"solana",SHIB:"shiba-inu",BONK:"bonk",SYRUP:"maple",FARTCOIN:"fartcoin",XRP:"ripple",DOGE:"dogecoin",LINK:"chainlink",AVAX:"avalanche-2",ADA:"cardano",SUI:"sui",PEPE:"pepe",WIF:"dogwifcoin",POPCAT:"popcat",BLESS:"bless"};

const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search); const ASSET=(q.get("asset")||"AAVE").toUpperCase();

function parseCSV(t){const rows=[];let row=[],cur="",inq=false;for(let i=0;i<t.length;i++){const c=t[i];if(inq){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=c;}else{if(c==='"')inq=true;else if(c===","){row.push(cur);cur="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur="";}else cur+=c;}}if(cur.length||row.length){row.push(cur);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()));}
function objs(rows){const h=rows[0].map(x=>x.trim().toLowerCase());return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||"").trim());return o;});}
const _get=(o,...keys)=>{for(const k of keys){const hit=Object.keys(o).find(h=>h.includes(k));if(hit&&o[hit])return o[hit];}return "";};
const get=(o,...keys)=>{
  const k=keys[0];
  if(/^tp[123]$/.test(k)){const n=+k[2];const single=_get(o,k);const combo=Object.keys(o).find(h=>h.includes("tp1")&&h.includes("tp2"));
    if(combo&&o[combo]){const nums=o[combo].match(/\d+(\.\d+)?/g)||[];return nums[n-1]||"";} return single;}
  if(k==="stop")return _get(o,"stop","stp");
  if(k==="trigger 3")return _get(o,"trigger 3","tigger 3");
  if(k==="confidence up"||k==="confidence down"){const combo=Object.keys(o).find(h=>h.includes("confidence up")&&h.includes("down"));
    if(combo&&o[combo]){const parts=o[combo].split(/\n|\s\/\s|\|/).map(x=>x.trim()).filter(Boolean);return k==="confidence up"?(parts[0]||""):(parts[1]||"");} return _get(o,k);}
  return _get(o,...keys);};
const num=s=>{const m=String(s).replace(/,/g,"").match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):null;};
const numTrigger=s=>{const clean=String(s).replace(/,/g,"");const dollar=clean.match(/\$\s*(\d+(\.\d+)?)/);if(dollar)return parseFloat(dollar[1]);return num(clean);};
const fmt=p=>p==null?"—":"$"+p.toFixed(p>=100?2:p>=1?3:p>=0.01?4:6);
const cleanHeadline=(a,h)=>{const esc_a=String(a).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");const re=new RegExp("^\\s*"+esc_a+"\\s*[—–\\-:]*\\s*","i");return String(h||"").replace(re,"").trim();};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const stamp=s=>{const d=new Date(s);return isNaN(d)?s:d.toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})+" EST";};
const driveId=u=>{const m=String(u).match(/[?&]id=([\w-]+)/)||String(u).match(/\/d\/([\w-]+)/);return m?m[1]:null;};
function chartImg(img,link){const id=driveId(img);if(id)return `https://drive.google.com/thumbnail?id=${id}&sz=w1600`;const tv=String(link).match(/tradingview\.com\/x\/(\w+)/);if(tv)return `https://s3.tradingview.com/snapshots/${tv[1][0]}/${tv[1]}.png`;return null;}
const STATUS=s=>{s=s.toLowerCase();if(s.includes("short"))return["b-short","▼ ACTIVE SHORT"];if(s.includes("active")||s.includes("long"))return["b-active","▲ ACTIVE LONG"];if(s.includes("watch"))return["b-watch","👀 WATCHING — NO TRIGGER YET"];if(s.includes("no trade"))return["b-none","NO TRADE RIGHT NOW"];if(s.includes("invalid"))return["b-invalid","✕ INVALIDATED — SETUP NO LONGER VALID"];if(s.includes("closed"))return["b-closed","■ CLOSED — SEE THE LESSON"];return["b-none",s.toUpperCase()];};

function levels(r){
  const L=[];const add=(role,val,kind,note)=>{const p=num(val);if(p!=null)L.push({role,price:p,kind,note});};
  add("TP3",get(r,"tp3"),"tp","Final target. Runner only.");add("TP2",get(r,"tp2"),"tp","Second scale-out. Move stop to entry or better.");add("TP1",get(r,"tp1"),"tp","First scale-out. Take 70–75% into targets.");
  [3,2,1].forEach(i=>{const t=get(r,"trigger "+i);if(t){const p=numTrigger(t);L.push({role:"TRIGGER "+i,price:p,kind:"res",note:t});}});
  add("SUPPORT / SAFETY NET",get(r,"safety"),"sup","Structure the trade leans on. Stop goes below, not inside.");add("STOP",get(r,"stop"),"stop","Size the position to this. Never tighten the stop to fit the size.");
  return L.filter(l=>l.price!=null).sort((a,b)=>b.price-a.price);
}
function diff(cur,prev){if(!prev)return[];const out=[];["tp1","tp2","tp3","stop","safety","trigger 1","trigger 2","trigger 3","status"].forEach(k=>{const a=get(cur,k),b=get(prev,k);if(a!==b)out.push(`${k.toUpperCase()}: ${b||"—"} → ${a||"—"}`);});return out;}

function skoolPost(r){
  const s=get(r,"status");const T=[1,2,3].map(i=>get(r,"trigger "+i)).filter(Boolean);
  return [`${STATUS(s)[1].replace(/^[▲▼✕■👀] /,"")} — ${ASSET}`,``,`🔔 Tap the bell on this post. We'll comment when price reaches each level.`,``,
  T.length?`📍 THE LEVELS\n`+T.map(t=>t).join("\n"):"",``,
  `🎯 TARGETS — take 70–75% into these\nTP1 ${get(r,"tp1")} · TP2 ${get(r,"tp2")} · TP3 ${get(r,"tp3")}`,``,
  `🛑 STOP ${get(r,"stop")}${get(r,"safety")?" · safety net "+get(r,"safety"):""}`,``,
  get(r,"why")?`WHY\n${get(r,"why")}`:"",``,get(r,"warning")?`⚠️ ${get(r,"warning")}`:"",``,
  `📲 Live sheet: ${location.href.split("#")[0]}`,``,`Levels are structure, not instructions. Your entry, your risk.\nNot financial advice. For educational purposes only. Trading involves risk. Protect your capital. DYOR.\n\nLEVEL UP ⚡`].join("\n").replace(/\n{3,}/g,"\n\n");
}

async function load(){
  let text="";
  if(SHEET_CSV){try{const r=await fetch(SHEET_CSV+(SHEET_CSV.includes("?")?"&":"?")+"t="+Date.now());text=await r.text();}catch(e){}}
  if(!text){$("#app").innerHTML=`<div class="empty">Can't read the setup sheet. Share it as <b>Anyone with the link → Viewer</b>.</div>`;return;}
  const rows=objs(parseCSV(text)).filter(r=>get(r,"asset").toUpperCase()===ASSET);
  if(!rows.length){$("#app").innerHTML=`<div class="empty">No setup on file for <b>${esc(ASSET)}</b> yet.</div>`;return;}
  rows.sort((a,b)=>new Date(get(a,"timestamp"))-new Date(get(b,"timestamp")));
  const cur=rows[rows.length-1],prev=rows[rows.length-2],ver=rows.length;
  const [bcls,btxt]=STATUS(get(cur,"status"));const closed=/closed|invalid/i.test(get(cur,"status"));const paused=/watch|no trade/i.test(get(cur,"status"));
  const L=levels(cur);const img=chartImg(get(cur,"chart image"),get(cur,"chart link"));const vm=driveId(get(cur,"voice"));
  const d=diff(cur,prev);

  let h=`<div class="banner ${bcls}"><span>${btxt}</span><small>v${ver} · updated ${stamp(get(cur,"timestamp"))}</small></div>`;
  h+=`<div class="head"><div><div class="kicker">LEVEL UP CRYPTO · LIVE SETUP</div><h1>${esc(ASSET)} <em>${esc(cleanHeadline(ASSET,get(cur,"headline"))||"SETUP")}</em></h1><div class="rule"></div><div class="dateline" id="dateline">Called ${stamp(get(cur,"timestamp"))}</div></div><div class="logo"><img src="${LOGO_SRC}" alt="" onerror="this.parentNode.style.display='none'"></div></div>`;
  if(d.length)h+=`<div class="diff">Changed since v${ver-1}: ${esc(d.join("  ·  "))}</div>`;
  if(closed){h+=`<div class="sect"><div class="bar"></div><h2>What happened</h2></div><div class="lesson"><div class="wl">Outcome</div><h3>${esc(get(cur,"outcome")||"Setup closed")}</h3><div class="wl" style="margin-top:14px">The lesson</div><p>${esc(get(cur,"lesson")||"—")}</p></div>`;}
  if(img)h+=`<div class="chart"><img src="${img}" alt="Chelsea's chart"></div>`;
  h+=`<div class="btnrow">${get(cur,"chart link")?`<a class="btn" href="${esc(get(cur,"chart link"))}" target="_blank">Open interactive chart</a>`:""}<button class="btn primary" id="copy">Copy Skool post</button></div>`;
  if(vm)h+=`<div class="card soft"><h3>Chelsea's read — voice</h3><iframe class="audio" src="https://drive.google.com/file/d/${vm}/preview" allow="autoplay"></iframe></div>`;
  h+=`<div class="${(closed||paused)?"faded":""}">`;
  if(get(cur,"why"))h+=`<div class="sect"><div class="bar"></div><h2>Why</h2></div><div class="card"><p>${esc(get(cur,"why"))}</p></div>`;
  const T=[1,2,3].map(i=>get(cur,"trigger "+i)).filter(Boolean);
  if(T.length){h+=`<div class="sect"><div class="bar"></div><h2>The Levels</h2></div>`;T.forEach((t,i)=>h+=`<div class="card soft"><h3>Trigger ${i+1}</h3><p>${esc(t)}</p></div>`);}
  if(L.length){h+=`<div class="sect"><div class="bar"></div><h2>The Ladder</h2><div class="hint">live price</div></div><div class="ladder" id="ladder">`;
    const rowsH=L.map(l=>`<div class="row" data-p="${l.price}"><div class="dot d-${l.kind}"></div><div><div class="rl">${esc(l.role)}</div><div class="rn">${esc(l.note)}</div></div><div class="rp">${fmt(l.price)}<small>${l.kind==="tp"?"target":l.kind==="stop"?"invalidation":"level"}</small></div></div>`);
    h+=rowsH.join("")+`</div><p class="rn" style="margin-top:10px"><b>Levels are structure, not instructions.</b> Price reaching a level is information. Whether it becomes an entry is your decision and your risk.</p>`;}
  if(get(cur,"warning"))h+=`<div class="sect"><div class="bar"></div><h2>Warning</h2></div><div class="warn"><div class="wh">Heads up</div><div class="wb">${esc(get(cur,"warning"))}</div></div>`;
  if(get(cur,"confidence up")||get(cur,"confidence down"))h+=`<div class="sect"><div class="bar"></div><h2>Confidence Check</h2></div><div class="grid2"><div class="inv up"><div class="ih">▲ Confidence up</div><div class="ib">${esc(get(cur,"confidence up"))}</div></div><div class="inv dn"><div class="ih">▼ Confidence down</div><div class="ib">${esc(get(cur,"confidence down"))}</div></div></div>`;
  h+=`</div>`;
  if(rows.length>1){h+=`<div class="sect"><div class="bar"></div><h2>Previous calls on ${esc(ASSET)}</h2><div class="hint">newest first · superseded</div></div>`;
    rows.slice(0,-1).reverse().forEach((r,i)=>{const [c,t]=STATUS(get(r,"status"));const v=rows.indexOf(r)+1;const lv=`TP ${get(r,"tp1")||"—"} / ${get(r,"tp2")||"—"} / ${get(r,"tp3")||"—"} · stop ${get(r,"stop")||"—"}`;
      h+=`<div class="hist"><div class="hh"><span class="hv">v${v} — ${esc(get(r,"headline")||ASSET)}</span><span class="hd">${stamp(get(r,"timestamp"))}</span><span class="pill ${c}">${t}</span></div><div class="lv">${esc([1,2,3].map(k=>get(r,"trigger "+k)).filter(Boolean).join("  ·  "))}<br>${esc(lv)}</div>${(get(r,"outcome")||get(r,"lesson"))?`<div class="out"><b>What happened:</b> ${esc(get(r,"outcome"))}${get(r,"lesson")?`<br><b>Lesson:</b> ${esc(get(r,"lesson"))}`:""}</div>`:""}</div>`;});}
  h+=`<div class="foot"><div class="f1">LEVEL UP ⚡ · NOT FINANCIAL ADVICE · DYOR</div><div class="f2">Not financial advice. For educational purposes only. Trading involves risk. Protect your capital. Always use a stop loss. Leverage is a personal choice based on your own risk tolerance. Don't compare trades or position sizes.</div></div>`;
  $("#app").innerHTML=h;
  $("#copy").onclick=()=>{navigator.clipboard.writeText(skoolPost(cur));$("#copy").textContent="Copied ✓";setTimeout(()=>$("#copy").textContent="Copy Skool post",1500);};
  livePrice(L);
}

let nowRow=null;
async function livePrice(L){
  let id=GECKO[ASSET]||localStorage.getItem("gecko:"+ASSET);
  if(!id){try{const s=await (await fetch("https://api.coingecko.com/api/v3/search?query="+ASSET)).json();const hit=(s.coins||[]).filter(c=>c.symbol.toUpperCase()===ASSET).sort((a,b)=>(a.market_cap_rank||1e9)-(b.market_cap_rank||1e9))[0];if(hit){id=hit.id;localStorage.setItem("gecko:"+ASSET,id);}}catch(e){}}
  if(!id)return;let px=0;
  try{const g=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd`);px=parseFloat((await g.json())[id].usd);}catch(e){}
  if(!px)return;
  const t=new Date().toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"});
  const dl=$("#dateline");if(dl)dl.innerHTML=dl.textContent.split("  ·  LIVE")[0]+`  ·  LIVE ${fmt(px)} @ ${t} EST`;
  const lad=$("#ladder");if(!lad)return;
  if(!nowRow){nowRow=document.createElement("div");nowRow.className="row now";nowRow.innerHTML=`<div class="dot d-now"></div><div><div class="rl">NOW</div><div class="rn">Live price. Everything above this line is earned, not assumed.</div></div><div class="rp"><span id="nowp"></span><small>live</small></div>`;}
  nowRow.querySelector("#nowp").textContent=fmt(px);
  const rows=[...lad.querySelectorAll(".row:not(.now)")];let placed=false;
  for(const r of rows){if(parseFloat(r.dataset.p)<px){lad.insertBefore(nowRow,r);placed=true;break;}}
  if(!placed)lad.appendChild(nowRow);
}
load();setInterval(load,60000);setInterval(()=>livePrice(),30000);
</script>
</body>
</html>
