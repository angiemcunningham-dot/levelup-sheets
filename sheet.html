<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Up — Live Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#FA0398;--pink-soft:#FFE8F3;--pink-line:#F9C8E3;--ink:#111114;--gray:#6B7280;--gray2:#9CA3AF;--orange:#FF9500;--orange-d:#D97A00;--yellow:#E5A00D;--green:#22C55E;--green-d:#15803D;--red:#EF4444;--red-d:#B91C1C;--panel:linear-gradient(180deg,#1C1C25,#2B2B37)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#ECECF1;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
body{display:flex;justify-content:center;padding:24px 12px}
.sheet{position:relative;width:100%;max-width:1080px;background:#fff;overflow:hidden;box-shadow:0 18px 60px rgba(13,13,15,.16)}
.sheet::before,.sheet::after{content:"";position:absolute;left:0;right:0;height:7px;z-index:6;background:linear-gradient(90deg,var(--orange),var(--pink))}
.sheet::before{top:0}.sheet::after{bottom:0}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.g1{width:620px;height:620px;top:-260px;right:-200px;background:radial-gradient(circle,rgba(250,3,152,.13),transparent 68%)}
.g2{width:520px;height:520px;top:180px;left:-240px;background:radial-gradient(circle,rgba(250,3,152,.10),transparent 68%)}
.inner{position:relative;z-index:2;padding:38px 40px 30px}
.banner{margin:0 0 22px;padding:14px 18px;border-radius:12px;font-family:Archivo;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.banner small{font-family:Inter;font-weight:600;font-size:12px;letter-spacing:.02em;text-transform:none;opacity:.85}
.b-active{background:rgba(34,197,94,.12);border:2px solid var(--green);color:var(--green-d)}
.b-short{background:rgba(239,68,68,.10);border:2px solid var(--red);color:var(--red-d)}
.b-watch{background:#FFF4E0;border:2px solid var(--orange);color:var(--orange-d)}
.b-none{background:#F3F4F6;border:2px solid var(--gray2);color:#374151}
.b-closed{background:#F3F4F6;border:2px solid #374151;color:#111}
.b-invalid{background:rgba(239,68,68,.10);border:2px solid var(--red);color:var(--red-d)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--pink);text-transform:uppercase}
h1{font-family:Archivo;font-weight:900;font-size:clamp(34px,6.4vw,62px);line-height:.94;letter-spacing:-.02em;margin:10px 0 0;text-transform:uppercase}
h1 em{font-style:normal;color:var(--pink)}
.rule{height:8px;background:var(--pink);width:260px;margin:14px 0 12px;border-radius:2px}
.dateline{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--gray);letter-spacing:.04em;line-height:1.6}
.logo{flex:0 0 auto;width:96px;height:92px;filter:drop-shadow(0 0 12px rgba(250,3,152,.45))}.logo img{width:100%;height:100%;object-fit:contain}
.sect{display:flex;align-items:center;gap:12px;margin:34px 0 16px}.sect .bar{width:7px;height:26px;background:var(--pink);border-radius:2px}
.sect h2{font-family:Archivo;font-weight:800;font-size:20px;letter-spacing:.03em;text-transform:uppercase}.sect .hint{margin-left:auto;font-size:11px;font-weight:600;color:var(--gray2);letter-spacing:.06em;text-transform:uppercase}
.card{border:2px solid var(--pink);border-radius:14px;padding:20px 22px;background:#fff;box-shadow:0 10px 28px rgba(13,13,15,.07);margin-bottom:12px}
.card.soft{border-color:var(--pink-line);box-shadow:none}
.card h3{font-family:Archivo;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.card p{font-size:14px;line-height:1.65;color:#2A2A32;white-space:pre-line}
.lesson{background:var(--panel);border:2px solid var(--pink);border-radius:14px;padding:22px 24px;color:#D6D6DE;box-shadow:0 0 22px rgba(250,3,152,.16);margin-bottom:14px}
.lesson .wl{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--pink);text-transform:uppercase}
.lesson h3{font-family:Archivo;font-weight:800;font-size:20px;color:#fff;margin:8px 0 10px;text-transform:uppercase}
.lesson p{font-size:14px;line-height:1.7;white-space:pre-line}
.lesson b{color:#fff}
.chart{border:2px solid var(--pink);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:12px}
.chart img{display:block;width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.btn{font-family:Inter;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;border-radius:999px;border:2px solid var(--pink);background:#fff;color:var(--pink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--pink);color:#fff}
.ladder{border:2px solid var(--pink);border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 10px 28px rgba(13,13,15,.07)}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:15px 20px;border-bottom:1px solid #F0F0F4}
.row:last-child{border-bottom:none}.row.now{background:var(--pink-soft);border-top:2px solid var(--pink);border-bottom:2px solid var(--pink)}
.dot{width:14px;height:14px;border-radius:50%;margin:0 auto}
.d-tp{background:var(--green)}.d-res{background:var(--yellow)}.d-now{background:var(--pink);animation:pulse 1.8s infinite}.d-sup{background:var(--gray2)}.d-stop{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,3,152,.6)}70%{box-shadow:0 0 0 14px rgba(250,3,152,0)}100%{box-shadow:0 0 0 0 rgba(250,3,152,0)}}
.rl{font-family:Archivo;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}.rn{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.45}
.rp{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:23px;text-align:right;white-space:nowrap}.rp small{display:block;font-size:10px;font-weight:500;color:var(--gray2);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.faded .ladder,.faded .card{opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inv{border-radius:12px;padding:16px 18px;border:2px solid}.inv.up{border-color:var(--green);background:rgba(34,197,94,.07)}.inv.dn{border-color:var(--red);background:rgba(239,68,68,.06)}
.inv .ih{font-family:Archivo;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}.inv.up .ih{color:var(--green-d)}.inv.dn .ih{color:var(--red-d)}.inv .ib{font-size:13px;line-height:1.6;white-space:pre-line}
.warn{border-radius:12px;padding:16px 18px;background:#FFF4E0;border:2px solid var(--orange);margin-bottom:12px}.warn .wh{font-family:Archivo;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-d);margin-bottom:6px}.warn .wb{font-size:13.5px;line-height:1.6;color:#3A2E18;white-space:pre-line}
.diff{font-size:12px;color:var(--orange-d);background:#FFF4E0;border:1px solid var(--orange);border-radius:8px;padding:8px 12px;margin:10px 0}
.hist{border:2px solid var(--pink-line);border-radius:12px;padding:16px 18px;margin-bottom:10px;background:#fff}
.hist .hh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.hist .hv{font-family:Archivo;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.hist .hd{font-family:"JetBrains Mono";font-size:11px;color:var(--gray)}
.hist .pill{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid}
.hist .lv{font-size:12px;color:var(--gray);line-height:1.6}.hist .out{font-size:13px;margin-top:8px;line-height:1.6;white-space:pre-line}
.hist .out b{color:var(--pink)}
.src{display:inline-block;font-family:Inter;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid;margin-right:6px;vertical-align:middle;white-space:nowrap}
.s-ch{color:var(--pink);border-color:var(--pink);background:var(--pink-soft)}.s-ad{color:#374151;border-color:var(--gray2);background:#F3F4F6}.s-pc{color:#1D4ED8;border-color:#93C5FD;background:#EFF6FF}.s-ot{color:#92400E;border-color:#FCD34D;background:#FFFBEB}
.tl{margin:14px 0 4px;border:2px solid var(--pink-line);border-radius:12px;padding:12px 16px;display:grid;gap:8px;font-size:13px;line-height:1.5}
.tl>div{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:baseline}.tl b{font-family:Archivo;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.histnote{background:#F3F4F6;border:2px dashed var(--gray2);border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.55;margin:0 0 12px;color:#374151}
.hist.pcrow{opacity:.78;border-style:dashed}
.foot{margin-top:32px;padding-top:18px;border-top:2px solid var(--pink-line);text-align:center}.foot .f1{font-family:Archivo;font-weight:800;font-size:13px;letter-spacing:.18em;color:var(--pink);text-transform:uppercase}.foot .f2{font-size:11.5px;color:var(--gray);margin-top:8px;line-height:1.6;max-width:720px;margin-left:auto;margin-right:auto}
.empty{padding:60px 20px;text-align:center;color:var(--gray)}
audio,iframe.audio{width:100%;margin-top:10px;border:0;height:80px}
@media(max-width:640px){.tl>div{grid-template-columns:1fr;gap:2px}.inner{padding:30px 18px 24px}.grid2{grid-template-columns:1fr}.head{flex-direction:column-reverse;align-items:flex-start}.row{grid-template-columns:40px 1fr auto;padding:13px 14px;gap:10px}.rp{font-size:19px}}
</style>
<style id="att-css">
/* ===== LIVE ATTENTION (staging addon) — presentation only; tiers map 1:1 to the monitor's attention bands ===== */
.att{margin-top:30px}
.att[hidden]{display:none}
.att-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.att-title{font-family:Archivo,Inter,system-ui,sans-serif;font-weight:900;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.att-title em{font-style:normal;color:var(--pink)}
.att-live{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--gray);letter-spacing:.03em}
.att-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle;animation:attBlink 1.6s ease-in-out infinite}
.att-dot.off{background:var(--gray2);animation:none}
.att-note{font-size:11.5px;color:var(--gray);line-height:1.55;margin-top:8px;max-width:820px}
.att-note b{color:#374151}

/* ticker tape */
.att-tape{margin-top:14px;overflow:hidden;border:2px solid var(--pink-line);border-radius:999px;background:#fff;position:relative}
.att-tape-track{display:flex;width:max-content;gap:0;animation:attTape 42s linear infinite}
.att-tape:hover .att-tape-track{animation-play-state:paused}
.att-tape-item{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;font-family:"JetBrains Mono",monospace;font-size:12px;white-space:nowrap;color:#374151;text-decoration:none;border-right:1px solid var(--pink-line)}
.att-tape-item b{font-family:Archivo,Inter,sans-serif;font-weight:900;font-size:13px;color:var(--ink);letter-spacing:.02em}
.att-tape-item .p{font-weight:800;color:var(--tc,#374151)}
.att-tape-item.tier-3 .p,.att-tape-item.tier-4 .p{color:var(--pink)}

/* cards */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px;margin-top:14px}
a.att-card{--tc:#9CA3AF;--tg:rgba(156,163,175,.35);position:relative;display:block;text-decoration:none;color:inherit;border:2px solid var(--tc);border-radius:14px;padding:14px 16px 13px;background:#fff;transition:transform .2s,box-shadow .2s}
a.att-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px var(--tg)}
.att-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.att-asset{font-family:Archivo,Inter,sans-serif;font-weight:900;font-size:24px;letter-spacing:-.01em}
.att-dir{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#374151}
.att-pct{display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.att-pct b{font-family:Archivo,Inter,sans-serif;font-weight:900;font-size:30px;line-height:1;color:var(--tc);letter-spacing:-.02em}
.att-pct span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tc)}
.att-tag{display:inline-block;margin-top:8px;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:2px solid var(--tc);color:var(--tc);background:#fff}
.att-bar{height:6px;border-radius:99px;background:#F3F4F6;margin-top:10px;overflow:hidden}
.att-bar i{display:block;height:100%;border-radius:99px;background:var(--tc);transition:width .6s}
.att-meta{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--gray);margin-top:8px;line-height:1.55}

/* tiers = engine bands: 0 NORMAL >3% · 1 ATTENTION ≤3% · 2 MORE NOTICEABLE ≤2% · 3 HIGH ≤1% · 4 MAXIMUM ≤0.5% or inside the zone */
a.att-card.tier-0{--tc:#6B7280;--tg:rgba(107,114,128,.25);border-color:var(--pink-line)}
a.att-card.tier-0 .att-pct b{font-size:28px}
a.att-card.tier-1{--tc:#D9A404;--tg:rgba(217,164,4,.30);background:#FFFBEA}
a.att-card.tier-1 .att-pct b{font-size:32px}
a.att-card.tier-2{--tc:#E67E00;--tg:rgba(230,126,0,.32);background:#FFF4E0;border-width:3px}
a.att-card.tier-2 .att-pct b{font-size:38px}
a.att-card.tier-3{--tc:#FA0398;--tg:rgba(250,3,152,.32);background:#FFF0F8;border-width:3px;animation:attPulse 2.2s ease-in-out infinite}
a.att-card.tier-3 .att-pct b{font-size:44px}
a.att-card.tier-4{--tc:#FA0398;--tg:rgba(250,3,152,.45);background:#FFE1F1;border-width:4px;animation:attPulseFast 1.15s ease-in-out infinite}
a.att-card.tier-4 .att-pct b{font-size:50px}
a.att-card.tier-4 .att-tag{background:var(--tc);color:#fff}
a.att-card.tier-3 .att-tag{background:var(--tc);color:#fff}
.att-sub{margin-top:18px;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}
.att-past{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
a.att-past-chip{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border:2px dashed var(--gray2);border-radius:999px;font-family:"JetBrains Mono",monospace;font-size:11px;color:#4B5563;text-decoration:none;background:#fff}
a.att-past-chip b{font-family:Archivo,Inter,sans-serif;font-weight:900;color:var(--ink)}
.att-empty{padding:16px;border:2px dashed var(--pink-line);border-radius:12px;color:var(--gray);font-size:13px;margin-top:14px}

/* ACTIVE NOW — status-driven section, deliberately different from the proximity cards (solid side bar, no proximity tiers, no pulse) */
.att.act{margin-top:26px}
.act-em{font-style:normal;color:var(--green-d)}
.act-grid{grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
a.act-card{--ac:#22C55E;--ad:#15803D;position:relative;display:block;text-decoration:none;color:inherit;border:2px solid var(--ac);border-left-width:10px;border-radius:14px;padding:14px 16px 13px;background:#F0FDF4;transition:transform .2s,box-shadow .2s}
a.act-card.side-short{--ac:#EF4444;--ad:#B91C1C;background:#FEF2F2}
a.act-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(21,128,61,.18)}
a.act-card.side-short:hover{box-shadow:0 10px 26px rgba(185,28,28,.18)}
.act-status{font-family:Archivo,Inter,sans-serif;font-weight:900;font-size:26px;letter-spacing:.01em;color:var(--ad);margin-top:6px;line-height:1.05}
.act-tag{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:2px solid var(--ac);color:var(--ad);background:#fff}
.att-chip.act{--tc:#15803D;background:#F0FDF4;border-color:#22C55E}
.att-chip.act.act-short{--tc:#B91C1C;background:#FEF2F2;border-color:#EF4444}
.att-chip.act span{font-size:12px}

/* chips reused on the existing grid cards and on the per-asset page */
.att-chip{--tc:#6B7280;--tg:rgba(107,114,128,.25);display:inline-flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin:8px 0 2px;padding:6px 12px;border:2px solid var(--tc);border-radius:10px;background:#fff;font-family:Archivo,Inter,sans-serif;font-weight:900;color:var(--tc);line-height:1.1}
.att-chip b{font-size:22px;letter-spacing:-.01em}
.att-chip span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.att-chip small{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:10.5px;color:var(--gray);letter-spacing:0}
.att-chip.tier-1{--tc:#D9A404;background:#FFFBEA}.att-chip.tier-2{--tc:#E67E00;background:#FFF4E0}
.att-chip.tier-3{--tc:#FA0398;background:#FFF0F8;animation:attPulse 2.2s ease-in-out infinite}
.att-chip.tier-4{--tc:#FA0398;background:#FFE1F1;animation:attPulseFast 1.15s ease-in-out infinite}
.att-chip.tier-4 b,.att-chip.tier-3 b{font-size:26px}
.att-chip.passed{--tc:#6B7280;border-style:dashed}

@keyframes attPulse{0%,100%{box-shadow:0 0 0 0 var(--tg)}50%{box-shadow:0 0 0 8px rgba(250,3,152,0)}}
@keyframes attPulseFast{0%,100%{box-shadow:0 0 0 0 var(--tg)}50%{box-shadow:0 0 0 12px rgba(250,3,152,0)}}
@keyframes attBlink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes attTape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){
  a.att-card,a.act-card,.att-chip,.att-dot,.att-tape-track{animation:none!important;transition:none!important}
  .att-tape{overflow-x:auto}
  a.att-card.tier-3,a.att-card.tier-4,.att-chip.tier-3,.att-chip.tier-4{box-shadow:0 0 0 4px var(--tg)}
}
@media(max-width:640px){.att-title{font-size:20px}.act-grid{grid-template-columns:repeat(2,minmax(0,1fr))}a.act-card{min-width:0;padding:11px 11px 10px}.act-status{font-size:20px}.att-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}a.att-card{min-width:0;padding:11px 11px 10px}.att-top{flex-wrap:wrap}.att-meta{overflow-wrap:anywhere}.att-asset{font-size:21px}.att-pct b{font-size:26px!important}a.att-card.tier-4 .att-pct b{font-size:36px!important}a.att-card.tier-3 .att-pct b{font-size:32px!important}a.att-card.tier-2 .att-pct b{font-size:30px!important}}
#att-chip{margin:12px 0 18px}
</style>
</head>

<script>
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/1MqfOX5EzRYvjQbd6U9RZTZ2ujm9_xx0LoT5rAzZxcPI/gviz/tq?tqx=out:csv&gid=1165837241";
const LOGO_SRC  = "bb_logo_pink.png";
const GECKO = {AERO:"aerodrome-finance",AAVE:"aave",BTC:"bitcoin",ETH:"ethereum",SOL:"solana",SHIB:"shiba-inu",BONK:"bonk",SYRUP:"maple",FARTCOIN:"fartcoin",XRP:"ripple",DOGE:"dogecoin",LINK:"chainlink",AVAX:"avalanche-2",ADA:"cardano",SUI:"sui",PEPE:"pepe",WIF:"dogwifcoin",POPCAT:"popcat",BLESS:"bless"};

const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search); const ASSET=(q.get("asset")||"AAVE").toUpperCase();

function parseCSV(t){const rows=[];let row=[],cur="",inq=false;for(let i=0;i<t.length;i++){const c=t[i];if(inq){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=c;}else{if(c==='"')inq=true;else if(c===","){row.push(cur);cur="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur="";}else cur+=c;}}if(cur.length||row.length){row.push(cur);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()));}
function objs(rows){const h=rows[0].map(x=>x.trim().toLowerCase());return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||"").trim());return o;});}
const _get=(o,...keys)=>{for(const k of keys){const hit=Object.keys(o).find(h=>h.includes(k));if(hit&&o[hit])return o[hit];}return "";};
const get=(o,...keys)=>{

});

       (att-ui:917-923) decides whether to replace that node by comparing old.outerHTML against a freshly-built
       chip's outerHTML - an attribute we add would make that comparison mismatch forever, so att-ui would keep
       replacing the (now un-hidden) node, which re-triggers this script's own MutationObserver on #app, which

       caught live in the browser; the Node test harness's fake MutationObserver never invokes callbacks, so it
       could not catch it). Toggling a class on <body> instead - completely outside #app - hides the chip via CSS

    function suppressStaleChip() {
      var chip = document.getElementById('att-chip');
      var shouldHide = !!(chip && chip.classList && chip.classList.contains('passed') && resolveCurrentState(ASSET_));

    var obs = new MutationObserver(function () { obs.disconnect(); applyAll(); obs.observe(app, { childList: true }); });

    load();
    loadDirection().then(applyAll);
    setInterval(load, 60000);
    setInterval(function () { loadDirection().then(applyAll); }, 60000);
    setInterval(applyAll, 15000);
    obs.observe(app, { childList: true });
    window.__mechFeed = { get: function () { return feed; }, mechanicalFor: mechanicalFor, resolveCurrentState: resolveCurrentState, directionFor: directionFor, ensure: ensure, ensureHeadline: ensureHeadline, suppressStaleChip: suppressStaleChip };   // test hook (read-only)
  } catch (e) { if (window.console) console.warn('mechanical feed addon disabled:', e); }
})();
